<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071014">
  <title>SPM Premium · Revisión</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071014;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading div{width:min(420px,92vw);padding:28px;border:1px solid #183845;border-radius:20px;background:#0a1d23}
    .loading b{display:block;font-size:22px;margin-bottom:10px}.loading p{margin:0;color:#a8bec7;line-height:1.5}
  </style>
</head>
<body>
  <main class="loading" id="loading"><div><b>Preparando SPM Premium…</b><p>Cargando la versión segura de revisión.</p></div></main>
  <script>
    (() => {
      'use strict';
      const ROOT = new URL('premium-v2/', location.href).href;
      const EXTRA = [
        'spm-language-core-v1.js?v=20260915v9',
        'assets/spm-insight-audio-v1.js?v=20260915v9',
        'evaluation-refresh-v1.js?v=20260915v9',
        'commercial-conversion-v1.js?v=20260915v9',
        'commercial-offer-v2.js?v=20260915v9',
        'signup-hotfix-v1.js?v=20260915v9',
        'checkpoint-evaluations-v1.js?v=20260915v9',
        'adaptation-engine-v1.js?v=20260915v9',
        'day28-outcomes-maintenance-v1.js?v=20260915v9',
        'real-avatar-img.js?v=20260915v9',
        'breathing-img-1.js?v=20260915v9',
        'breathing-img-2.js?v=20260915v9',
        'breathing-img-3.js?v=20260915v9',
        'recovery-story-premium-v4.js?v=20260915v9',
        'recovery-story-extra-v1.js?v=20260915v9',
        'recovery-story-voice-avatar-fix-v1.js?v=20260915v9',
        'spm-premium-polish-v3.js?v=20260915v9',
        'spm-activity-photos-v1.js?v=20260915v1'
      ];
      const scriptTag = src => '<scr' + 'ipt src="' + ROOT + src + '"><' + '/scr' + 'ipt>';
      fetch(ROOT + 'live-v4.html?v=20260915v9', {cache: 'no-store'})
        .then(response => {
          if (!response.ok) throw new Error('No se pudo cargar el piloto (' + response.status + ').');
          return response.text();
        })
        .then(source => {
          const base = '<base href="' + ROOT + '"><meta name="robots" content="noindex,nofollow,noarchive">';
          const extras = EXTRA.map(scriptTag).join('');
          const page = source
            .replace('<head>', '<head>' + base)
            .replace('</body>', extras + '</body>');
          document.open();
          document.write(page);
          document.close();
        })
        .catch(error => {
          const box = document.getElementById('loading');
          if (box) box.innerHTML = '<div><b>No pudimos abrir SPM</b><p>' + String(error.message || error) + '<br>Actualiza la página para volver a intentarlo.</p></div>';
        });
    })();
  </script>
</body>
</html>
