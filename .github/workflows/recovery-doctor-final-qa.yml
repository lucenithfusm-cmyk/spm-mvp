name: Recovery Doctor Final QA
on:
  push:
    branches: [ "feat/recovery-doctor-final" ]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/recovery-doctor-final.test.cjs
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 4173 >/tmp/rdqa.log 2>&1 &
      - env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/recovery-doctor-browser.cjs
