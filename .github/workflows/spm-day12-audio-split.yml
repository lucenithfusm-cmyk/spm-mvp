name: SPM Día 12 - crear tres clips completos
on:
  push:
    branches: [feat/erection-day12-touch-screens-20261117]
    paths: [.github/workflows/spm-day12-audio-split.yml]
permissions:
  contents: write
jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar narración original y exportar tres cortes en pausas reales
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: lucenithfusm-cmyk/spm-mvp
          BRANCH: feat/erection-day12-touch-screens-20261117
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          curl --fail --location --retry 3 --silent --show-error \
            --output /tmp/erection-day5-original.mp3 \
            https://raw.githubusercontent.com/lucenithfusm-cmyk/spm-mvp/main/premium-v2/assets/audio/erection/erection-day-5-20261113.mp3
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          src='/tmp/erection-day5-original.mp3'
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',src]).decode().strip())
          assert 49.6<duration<49.9, f'Source length unexpected: {duration}'
          # Detected quiet intervals: 16.077-16.553 and 32.297-32.896 seconds.
          sections=[(0.0,16.315),(16.315,32.596),(32.596,duration)]
          for n,(start,end) in enumerate(sections,1):
              path=pathlib.Path(f'/tmp/spm-dia12-screen-{n:02d}.mp3')
              cmd=['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{start:.3f}','-t',f'{end-start:.3f}','-i',src,'-vn','-ac','1','-ar','44100','-c:a','libmp3lame','-b:a','160k',str(path)]
              subprocess.run(cmd,check=True)
              rendered=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(path)]).decode().strip())
              assert abs(rendered-(end-start))<.11,(n,rendered,start,end)
              data=path.read_bytes()
              assert len(data)>100000
              target=f'premium-v2/assets/audio/erection/erection-day-5-screen-{n:02d}-20261117.mp3'
              body=json.dumps({'message':f'SPM Dia 12: clip {n} de 3 con corte en silencio natural','branch':os.environ['BRANCH'],'content':base64.b64encode(data).decode()}).encode()
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{target}",data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.load(response)
              print(f'Clip {n}: source [{start:.3f},{end:.3f}], {rendered:.2f} s, {len(data)} bytes; GitHub {result["commit"]["sha"]}')
          PY
