name: SPM day15 approved guidance audio import
on:
  push:
    branches: [feat/erection-day15-visual-preview-20261117]
    paths: [.github/workflows/spm-day15-audio-20261117.yml]
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Store generated voice as versioned audio without touching other assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          url="https://resource2.heygen.ai/text_to_speech/f27f0d2de72d470e919ed331523331ef/84854979e66846989bc6c5855f53268f/id=dd3ad57adb684fd497e4ac8bdd04aa28.mp3"
          target='premium-v2/assets/audio/erection/erection-day15-stimuli-20261117.mp3'
          req=urllib.request.Request(url,headers={'User-Agent':'SPM-Voice-Importer/1.0'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          assert 100000<len(data)<3000000, 'Unexpected audio payload length'
          assert data[:3]==b'ID3' or data[:2] in (b'\xff\xfb',b'\xff\xf3',b'\xff\xf2'), 'Not MP3 audio'
          body=json.dumps({'message':'audio: añadir guía nueva específica de estímulos para erección Día 15','branch':'feat/erection-day15-visual-preview-20261117','content':base64.b64encode(data).decode('ascii')}).encode()
          api='https://api.github.com/repos/lucenithfusm-cmyk/spm-mvp/contents/'+target
          request=urllib.request.Request(api,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='PUT')
          with urllib.request.urlopen(request,timeout=90) as response: out=json.load(response)
          print('Uploaded:',target,'bytes:',len(data),'sha256:',hashlib.sha256(data).hexdigest(),'commit:',out['commit']['sha'])
          PY
