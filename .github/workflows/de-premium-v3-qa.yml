name: DE Premium V3 QA
on:
  push:
    branches: [ "feat/de-premium-final" ]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate DE Premium V3
        run: node tests/de-premium-v3.test.cjs
