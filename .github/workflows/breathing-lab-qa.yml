name: Daily practice and media QA
on:
  pull_request:
    paths: ["labs/breathing/**", "labs/sensate/**", "premium-v2/breathing-lab/**", "premium-v2/sensate-lab/**", "premium-v2/*lab-bridge-v1.js", "premium-v2/*daily*", "premium-v2/spm-video-library.js", "premium-v2/program-videos-v1.js", "premium-v2/app-live.js", "premium-v2/live.html", "tests/breathing-lab-*", "tests/sensate-lab-*", "tests/desire-lab-*", "tests/daily-*", "tests/erection-daily-*", "tests/program-videos-*", ".github/workflows/breathing-lab-qa.yml"]
  workflow_dispatch:
jobs:
  breathing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix labs/breathing --no-audit --no-fund
      - run: npm ci --prefix labs/sensate --no-audit --no-fund
      - run: cd labs/breathing && sha256sum --check media-sha256.txt
      - run: npm run typecheck --prefix labs/breathing && npm run build --prefix labs/breathing
      - run: npm run typecheck --prefix labs/sensate && npm run build --prefix labs/sensate
      - run: git diff --exit-code -- premium-v2/breathing-lab premium-v2/sensate-lab
      - run: npx --prefix labs/breathing vitest run --root labs/breathing
      - run: node --test tests/breathing-lab-bridge.test.cjs tests/sensate-lab-bridge.test.cjs tests/desire-lab-bridge.test.cjs tests/daily-support-plan.test.cjs tests/daily-entry.test.cjs tests/daily-practice.test.cjs tests/program-videos.test.cjs
      - run: npm install --prefix /tmp/spm-browser-qa playwright@1.62.1 --no-audit --no-fund
      - name: Verify daily activities and synchronized video in a real browser
        env:
          NODE_PATH: /tmp/spm-browser-qa/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/support/static-server.cjs >/tmp/spm-server.log 2>&1 &
          spm_server_pid=$!
          trap 'kill "$spm_server_pid" 2>/dev/null || true' EXIT
          node tests/breathing-lab-browser.cjs
          node tests/daily-entry-browser.cjs
          node tests/daily-practice-browser.cjs
          node tests/daily-safety-calendar-browser.cjs
          node tests/erection-daily-browser.cjs
          node tests/daily-resources-browser.cjs
          node tests/daily-cadence-browser.cjs
          node tests/program-videos-browser.cjs
