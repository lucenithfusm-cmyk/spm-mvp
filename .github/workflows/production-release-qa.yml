name: SPM source and published release QA
on:
  pull_request:
    paths: ['premium-v2/evaluacion.html', 'premium-v2/app-live.js', 'premium-v2/commercial-conversion-v1.js', 'tests/commercial-funnel-browser.cjs', 'tests/production-release-browser.cjs', '.github/workflows/production-release-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-source:
    name: Commercial source (local, no payment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/spm-release-qa playwright@1.62.1 --no-audit --no-fund
      - name: Test commercial review against local source (no payment)
        env:
          NODE_PATH: /tmp/spm-release-qa/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/support/static-server.cjs >/tmp/spm-server.log 2>&1 &
          spm_server_pid=$!
          trap 'kill "$spm_server_pid" 2>/dev/null || true' EXIT
          node tests/commercial-funnel-browser.cjs
  published:
    name: Published program (manual)
    # A PR checks source that is not yet deployed to the production alias.
    # Manual release verification remains strict, including while it is paused.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/spm-release-qa playwright@1.62.1 --no-audit --no-fund
      - name: Test published routes with synthetic data only
        env:
          NODE_PATH: /tmp/spm-release-qa/node_modules
          CHROME_BIN: /usr/bin/google-chrome
          SPM_TEST_BASE: https://spm-premium-staging.vercel.app/premium-v2/
        run: |
          node tests/production-release-browser.cjs
          node tests/daily-safety-calendar-browser.cjs
          node tests/erection-daily-browser.cjs
          node tests/daily-resources-browser.cjs
          node tests/daily-cadence-browser.cjs
          node tests/program-videos-browser.cjs
