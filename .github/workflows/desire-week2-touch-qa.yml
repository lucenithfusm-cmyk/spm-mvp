name: SPM Deseo Semana 2 · QA piloto táctil
on:
  pull_request:
    paths:
      - 'premium-v2/desire-week2-v1/**'
      - 'premium-v2/desire-week2-bridge-v1.*'
      - 'tests/desire-week2-touch.test.cjs'
      - 'tests/desire-week2-mobile-browser.cjs'
      - '.github/workflows/desire-week2-touch-qa.yml'
  push:
    branches:
      - 'spm-deseo-semana2-piloto-20261119'
    paths:
      - 'premium-v2/desire-week2-v1/**'
      - 'premium-v2/desire-week2-bridge-v1.*'
      - 'tests/desire-week2-touch.test.cjs'
      - 'tests/desire-week2-mobile-browser.cjs'
      - '.github/workflows/desire-week2-touch-qa.yml'
permissions:
  contents: read
jobs:
  week2-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify scripts parse
        run: |
          node --check premium-v2/desire-week2-v1/app.js
          node --check premium-v2/desire-week2-bridge-v1.js
      - name: Test isolated interactive days 8 to 14
        run: node --test tests/desire-week2-touch.test.cjs

  mobile-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test engine
        run: |
          npm install --prefix /tmp/spm-desire-week2-playwright playwright@1.62.1 --no-audit --no-fund
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            /tmp/spm-desire-week2-playwright/node_modules/.bin/playwright install --with-deps webkit
          fi
      - name: Validate seven interactive days with synthetic local records
        env:
          NODE_PATH: /tmp/spm-desire-week2-playwright/node_modules
          CHROME_BIN: /usr/bin/google-chrome
          SPM_BROWSER: ${{ matrix.engine }}
        run: |
          node tests/support/static-server.cjs >/tmp/spm-week2-static.log 2>&1 &
          spm_pid=$!
          trap 'kill "$spm_pid" 2>/dev/null || true' EXIT
          sleep 1
          node tests/desire-week2-mobile-browser.cjs
