name: Premium Resources Recovery QA
on:
  push:
    branches: [ "restore/premium-resources-final" ]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate restored approved assets and integration
        run: node tests/premium-resources-recovery.test.cjs
      - name: Install browser QA
        run: npm install --no-save puppeteer-core@24
      - name: Start local preview
        run: python3 -m http.server 4173 >/tmp/spm-premium-review.log 2>&1 &
      - name: Validate responsive Premium resources
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/premium-resources-browser.cjs
