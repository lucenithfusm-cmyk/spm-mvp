name: Import approved breathing media
on:
  push:
    branches: ["feat/breathing-lab-central-20261012"]
    paths: ["labs/breathing/import-media.json", ".github/workflows/breathing-media-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved media
        shell: python
        run: |
          import json, pathlib, hashlib, subprocess, concurrent.futures
          entries = json.loads(pathlib.Path('labs/breathing/import-media.json').read_text())
          def fetch(entry):
            path = pathlib.Path(entry['path'])
            assert str(path).startswith('labs/breathing/public/media/')
            path.parent.mkdir(parents=True, exist_ok=True)
            subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--silent', '--show-error', entry['url'], '-o', str(path)], check=True)
            assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], str(path)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            list(pool.map(fetch, entries))
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix labs/breathing --no-audit --no-fund
      - run: npm run typecheck --prefix labs/breathing && npm run build --prefix labs/breathing
      - run: npx --prefix labs/breathing vitest run --root labs/breathing
      - run: node --test tests/breathing-lab-bridge.test.cjs
      - name: Commit verified media and build to integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/breathing/public/media premium-v2/breathing-lab
          git commit -m 'Include verified approved breathing media and production build'
          git push origin HEAD:feat/breathing-lab-central-20261012
