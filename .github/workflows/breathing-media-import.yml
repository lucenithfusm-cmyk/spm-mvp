name: Import approved breathing media
on:
  push:
    branches: ["feat/breathing-lab-central-20261012"]
    paths: ["labs/breathing/import-media.json", ".github/workflows/breathing-media-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify approved media
        shell: python
        run: |
          import json, pathlib, hashlib, base64, tarfile, io
          parts = sorted(pathlib.Path('labs/breathing/import-chunks').glob('*.txt'))
          assert len(parts) == 78
          archive = base64.b64decode(''.join(p.read_text() for p in parts))
          assert hashlib.sha256(archive).hexdigest() == '08316ce0c4706ae88af6286ec212bbf9ca66a223174cf57cc3b92e4595495554'
          target = pathlib.Path('labs/breathing/public/media')
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
            assert all(m.isfile() and '/' not in m.name and '..' not in m.name for m in tar.getmembers())
            tar.extractall(target, filter='data')
          for entry in json.loads(pathlib.Path('labs/breathing/import-media.json').read_text()):
            path = pathlib.Path(entry['path'])
            assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], str(path)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix labs/breathing --no-audit --no-fund
      - run: npm run typecheck --prefix labs/breathing && npm run build --prefix labs/breathing
      - run: npx --prefix labs/breathing vitest run --root labs/breathing
      - run: node --test tests/breathing-lab-bridge.test.cjs
      - name: Commit verified media and build to integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r labs/breathing/import-chunks
          git rm labs/breathing/import-media.json .github/workflows/breathing-media-import.yml
          git add labs/breathing/public/media premium-v2/breathing-lab
          git commit -m 'Include verified approved breathing media and production build'
          git push origin HEAD:feat/breathing-lab-central-20261012
