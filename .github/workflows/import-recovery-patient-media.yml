name: Import Recovery patient media

on:
  push:
    branches:
      - feat/premium-resources-staging
    paths:
      - '.github/workflows/import-recovery-patient-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-patient-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
