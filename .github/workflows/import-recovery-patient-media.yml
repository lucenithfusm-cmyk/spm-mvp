      - name: Build one reusable video and patient audio tracks
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i tmp-recovery/during.mp4 -an -vf "scale='min(720,iw)':-2" -c:v libx264 -preset medium -crf 27 -movflags +faststart premium-v2/assets/videos/recovery-patient-master.mp4
          for id in condom before during early urge partner next; do
            ffmpeg -hide_banner -loglevel error -y -i "tmp-recovery/$id.mp4" -vn -ac 1 -ar 44100 -b:a 96k "premium-v2/assets/audio/recovery-patient-$id-es.mp3"
          done
          ls -lh premium-v2/assets/videos/recovery-patient-master.mp4 premium-v2/assets/audio/recovery-patient-*-es.mp3
      - name: Commit imported patient media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-v2/assets/videos/recovery-patient-master.mp4 premium-v2/assets/audio/recovery-patient-*-es.mp3
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add local Recovery patient media'
          git push
