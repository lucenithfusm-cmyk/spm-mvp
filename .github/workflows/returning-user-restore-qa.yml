name: Returning user restoration QA
on:
  push:
    branches: ["fix/performance-map-render-loop-v4"]
  pull_request:
    paths: ["premium-v2/**", "tests/returning-user-*", ".github/workflows/returning-user-restore-qa.yml"]
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/spm-restore-qa jsdom@26.1.0 --no-audit --no-fund
      - name: Verify DE and EP restoration with all Premium layers
        env:
          NODE_PATH: /tmp/spm-restore-qa/node_modules
          SPM_QA_ALL_LAYERS: "1"
        run: node tests/returning-user-restore.test.cjs
