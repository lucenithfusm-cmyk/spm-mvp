name: Build DNDA evidence snapshot

on:
  push:
    branches:
      - evidence/spm-dnda-snapshot-6194bf60

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact registered commit
        uses: actions/checkout@v4
        with:
          ref: 6194bf60b5a42eac868406e8d2f57e3105564282
          fetch-depth: 0

      - name: Verify commit and build exact source archive
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "6194bf60b5a42eac868406e8d2f57e3105564282"
          ARCHIVE="SPM_source_snapshot_6194bf60b5a42eac868406e8d2f57e3105564282.zip"
          git archive --format=zip --prefix="spm-mvp-6194bf60b5a42eac868406e8d2f57e3105564282/" -o "$ARCHIVE" "6194bf60b5a42eac868406e8d2f57e3105564282"
          SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          {
            echo "SPM DIGITAL WELLNESS — DNDA EVIDENCE SNAPSHOT"
            echo "Repository: lucenithfusm-cmyk/spm-mvp"
            echo "Branch at time of identification: main"
            echo "Registered source commit: 6194bf60b5a42eac868406e8d2f57e3105564282"
            echo "Commit date: $(git show -s --format=%cI 6194bf60b5a42eac868406e8d2f57e3105564282)"
            echo "Commit subject: $(git show -s --format=%s 6194bf60b5a42eac868406e8d2f57e3105564282)"
            echo "Archive method: git archive --format=zip"
            echo "Archive file: $ARCHIVE"
            echo "Archive SHA-256: $SHA256"
            echo "Generated by GitHub Actions from the exact Git commit above."
          } > SPM_snapshot_manifest.txt
          sha256sum "$ARCHIVE" > SPM_snapshot_SHA256.txt

      - name: Upload DNDA evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: SPM-DNDA-snapshot-6194bf60
          path: |
            SPM_source_snapshot_6194bf60b5a42eac868406e8d2f57e3105564282.zip
            SPM_snapshot_manifest.txt
            SPM_snapshot_SHA256.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
