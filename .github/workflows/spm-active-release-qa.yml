name: SPM - one current module release
on:
  pull_request:
    paths:
      - 'premium-v2/**'
      - 'tests/active-module-release.test.cjs'
      - 'tests/erection-day3-touch.test.cjs'
      - 'tests/erection-day4-touch.test.cjs'
      - 'tests/erection-day5-touch.test.cjs'
      - 'tests/erection-day6-touch.test.cjs'
      - 'tests/erection-day7-touch.test.cjs'
      - 'tests/erection-day8-touch.test.cjs'
      - 'tests/erection-ten-schedule.test.cjs'
      - 'vercel.json'
      - '.github/workflows/spm-active-release-qa.yml'
  push:
    branches: [main]
    paths:
      - 'premium-v2/**'
      - 'tests/active-module-release.test.cjs'
      - 'tests/erection-day3-touch.test.cjs'
      - 'tests/erection-day4-touch.test.cjs'
      - 'tests/erection-day5-touch.test.cjs'
      - 'tests/erection-day6-touch.test.cjs'
      - 'tests/erection-day7-touch.test.cjs'
      - 'tests/erection-day8-touch.test.cjs'
      - 'tests/erection-ten-schedule.test.cjs'
      - 'vercel.json'
      - '.github/workflows/spm-active-release-qa.yml'
permissions:
  contents: read
jobs:
  active-module-parity:
    name: Current modules in Hoy and Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module version parity and approved entry
        run: node --test tests/active-module-release.test.cjs tests/erection-day1-touch.test.cjs tests/erection-day2-touch.test.cjs tests/erection-day3-touch.test.cjs tests/erection-day4-touch.test.cjs tests/erection-day5-touch.test.cjs tests/erection-day6-touch.test.cjs tests/erection-day7-touch.test.cjs tests/erection-day8-touch.test.cjs tests/erection-ten-schedule.test.cjs
