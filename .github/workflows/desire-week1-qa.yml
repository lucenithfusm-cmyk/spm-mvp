name: SPM Deseo tactile days 4-7 QA
on:
  push:
    paths:
      - 'premium-v2/desire-week1-v1/**'
      - 'premium-v2/desire-week1-bridge-v1.js'
      - 'premium-v2/live.html'
      - 'premium-v2/program-review-v1.js'
      - 'tests/desire-week1-touch.test.cjs'
      - 'tests/desire-access-browser.cjs'
      - 'tests/desire-calendar-access-browser.cjs'
      - 'premium-v2/daily-practice-v1.js'
      - 'premium-v2/desire-lab-bridge-v1.js'
      - 'premium-v2/revision-programas-28-dias.html'
      - '.github/workflows/desire-week1-qa.yml'
  pull_request:
    paths:
      - 'premium-v2/desire-week1-v1/**'
      - 'premium-v2/desire-week1-bridge-v1.js'
      - 'premium-v2/live.html'
      - 'premium-v2/program-review-v1.js'
      - 'tests/desire-week1-touch.test.cjs'
      - '.github/workflows/desire-week1-qa.yml'
permissions:
  contents: read
jobs:
  clinical-touch-week1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check isolated Desire bridge syntax
        run: node --check premium-v2/desire-week1-bridge-v1.js
      - name: Validate inlined app scripts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const s = fs.readFileSync('premium-v2/desire-week1-v1/index.html','utf8');
          for (const m of s.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/g)) new vm.Script(m[1]);
          NODE
      - name: Run Desire days 4-7 isolated integration tests
        run: node --test tests/desire-week1-touch.test.cjs

  access-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: npm install --prefix /tmp/spm-desire-access playwright@1.62.1 --no-audit --no-fund
      - name: Reproduce Desire opening in isolated reviewer
        env:
          NODE_PATH: /tmp/spm-desire-access/node_modules
          CHROME_BIN: /usr/bin/google-chrome
          SPM_TEST_BASE: https://spm-premium-staging.vercel.app/premium-v2/
        run: node tests/desire-access-browser.cjs

  ios-webkit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install WebKit engine and dependencies
        run: |
          npm install --prefix /tmp/spm-desire-access playwright@1.62.1 --no-audit --no-fund
          /tmp/spm-desire-access/node_modules/.bin/playwright install --with-deps webkit
      - name: Test module opening in Safari-compatible WebKit
        env:
          NODE_PATH: /tmp/spm-desire-access/node_modules
          SPM_BROWSER: webkit
          SPM_TEST_BASE: https://spm-premium-staging.vercel.app/premium-v2/
        run: node tests/desire-access-browser.cjs

  calendar-direct-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: npm install --prefix /tmp/spm-desire-access playwright@1.62.1 --no-audit --no-fund
      - name: Verify calendar-to-Deseo in actual application
        env:
          NODE_PATH: /tmp/spm-desire-access/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/support/static-server.cjs >/tmp/spm-desire-static.log 2>&1 &
          spm_pid=$!
          trap 'kill "$spm_pid" 2>/dev/null || true' EXIT
          sleep 1
          node tests/desire-calendar-access-browser.cjs
