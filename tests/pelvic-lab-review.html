<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SPM · Revisión Pelvic Floor Lab</title>
<style>body{margin:0;background:#e8eeee;color:#173c42;font:15px system-ui}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;gap:6px;align-items:center}select,button{padding:8px}iframe{height:900px;border:1px solid #789;margin:0 16px 16px;background:#071014}output{white-space:pre-wrap;display:block;padding:0 16px 16px;font:12px monospace}</style></head>
<body><header><strong>REVISIÓN · DATOS FICTICIOS · SIN CONEXIÓN A CUENTAS</strong><label>Cuenta <select id="route"><option value="erection">DE</option><option value="ejaculation">EP</option></select></label><label>Ancho <select id="width"><option value="390">Móvil 390</option><option value="768">Tablet 768</option><option value="1280">Escritorio 1280</option></select></label><label>Seguridad ficticia <select id="safety"><option value="none">Sin alertas</option><option value="review">Revisión</option></select></label><label><input type="checkbox" id="offline">Simular fallo de guardado</label><button id="pelvic">Abrir Piso Pélvico</button><button id="lab">Abrir Lab desde Hoy (día 12)</button><button id="reload">Recargar programa</button><button id="verify">Verificar estado</button></header><output id="result">Cargando SPM con datos de prueba…</output><iframe id="review" title="SPM con datos de prueba"></iframe>
<script>
const frame=document.getElementById('review'),result=document.getElementById('result');window.SPM_QA_DATABASE={};
function inspect(){const w=frame.contentWindow,d=w.document,lab=d.querySelector('.spm-pf-modal iframe')?.contentDocument;const rows=window.SPM_QA_DATABASE[document.getElementById('route').value]?.activity_completions||[];result.textContent=JSON.stringify({savedDay:w.SPM_RESOURCE_CONTEXT?.()?.day,currentDay:w.SPM_CURRENT_DAY,labScreen:lab?.querySelector('.pf-count')?.textContent,saveStatus:d.querySelector('[data-pf-status]')?.textContent,horizontalOverflow:lab?lab.documentElement.scrollWidth-lab.documentElement.clientWidth:null,images:lab?Array.from(lab.images).map(i=>({ok:i.complete&&i.naturalWidth>0,alt:i.alt})):[],state:rows.map(r=>({scope:r.user_id+':'+r.plan_id,day:r.day_number,module:r.module_key,state:r.metadata?.state})),errors:w.SPM_QA_ERRORS||[]},null,2)}
async function load(){frame.style.width=document.getElementById('width').value+'px';const url=new URL('../premium-v2/live.html',location.href);let html=await fetch(url,{cache:'no-store'}).then(r=>r.text());html=html.replace('<head>','<head><base href="'+new URL('.',url).href+'">').replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>/,'<script src="../tests/pelvic-lab-fixture.js"><'+'/script>');frame.onload=()=>setTimeout(inspect,2200);frame.srcdoc=html;}
document.getElementById('pelvic').onclick=()=>frame.contentWindow.SPM_PELVIC_HUB.open({origin:'library'});
document.getElementById('lab').onclick=()=>frame.contentWindow.SPM_PELVIC_LAB.open({origin:'dailyPlan',day:12});
document.getElementById('safety').onchange=load;document.getElementById('route').onchange=load;document.getElementById('reload').onclick=load;document.getElementById('width').onchange=()=>{frame.style.width=document.getElementById('width').value+'px';setTimeout(inspect,400)};document.getElementById('verify').onclick=inspect;load();
</script></body></html>
