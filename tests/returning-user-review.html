<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SPM · Verificación de restauración</title>
<style>body{margin:0;background:#e8eeee;color:#173c42;font:15px system-ui}header{padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}select,button{padding:8px}iframe{height:900px;border:1px solid #789;margin:0 16px 16px;background:#071014}output{white-space:pre-wrap;display:block;padding:0 16px 16px;font:13px monospace}</style></head>
<body><header><strong>PRUEBA TÉCNICA · DATOS FICTICIOS · SIN CONEXIÓN A CUENTAS</strong><label>Ruta <select id="route"><option value="erection">DE</option><option value="ejaculation">EP</option></select></label><label>Ancho <select id="width"><option value="390">Móvil 390</option><option value="768">Tablet 768</option><option value="1280">Escritorio 1280</option></select></label><button id="verify">Verificar estado</button></header><output id="result">Cargando la página real con datos de prueba…</output><iframe id="review" title="SPM con datos de prueba"></iframe>
<script>
const frame=document.getElementById('review'),result=document.getElementById('result');
function inspect(){const w=frame.contentWindow,d=w.document,o=d.getElementById('spmRestoreOverlay');result.textContent=JSON.stringify({mapVisible:!!d.querySelector('#map.on'),score:d.getElementById('scoreValue')?.textContent,overlayVisible:!!o&&w.getComputedStyle(o).display!=='none',savedDay:w.SPM_RESOURCE_CONTEXT?.()?.day,currentDay:w.SPM_CURRENT_DAY,wrongRouteButtons:d.querySelectorAll(document.getElementById('route').value==='erection'?'.ecLaunch':'.deLaunch').length,horizontalOverflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,errors:w.SPM_QA_ERRORS||[]},null,2)}
async function load(){frame.style.width=document.getElementById('width').value+'px';const url=new URL('../premium-v2/live.html',location.href);let html=await fetch(url,{cache:'no-store'}).then(r=>r.text());html=html.replace('<head>','<head><base href="'+new URL('.',url).href+'">').replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>/,'<script src="../tests/returning-user-fixture.js"><'+'/script>');frame.onload=()=>setTimeout(inspect,2200);frame.srcdoc=html;}
document.getElementById('route').onchange=load;document.getElementById('width').onchange=()=>{frame.style.width=document.getElementById('width').value+'px';setTimeout(inspect,500)};document.getElementById('verify').onclick=inspect;load();
</script></body></html>
