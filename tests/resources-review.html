<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPM resource review — synthetic data</title><link rel="stylesheet" href="../premium-v2/spm-resources.css"><style>body{background:#071014;color:white;font:16px system-ui;margin:0;padding:16px}button{min-height:44px}header{display:flex;flex-wrap:wrap;gap:8px}main{max-width:1100px;margin:auto}</style>
<header><b>LOCAL TEST · Synthetic data</b><button id="en">English</button><button id="es">Español</button><button id="safety">Toggle restriction</button><button id="breath">Breathing demo</button><button id="video">Doctor SPM</button></header>
<main><section id="plan"><div class="dayCard"><span class="dayNum">14</span><div class="interactive"></div></div></section><section id="map"></section><section id="progressPanel"></section><section id="breathing"></section></main>
<script src="../premium-v2/spm-language-core-v1.js"></script><script>
let blocked=false;const cloud=JSON.parse(localStorage.getItem('fixture-cloud')||'[]');window.SPM_RESOURCE_CONTEXT=()=>({userId:'fixture',planId:'fixture-plan',day:14,primary:'erection',motives:['erection','ejaculation'],safety:blocked?'review':'none',answers:{},flags:[],checkins:[],completed:[1,2,3,4,5,6,7]});
window.SPM_RESOURCE_RECORDS={read:async()=>cloud,save:async r=>{cloud.push(r);localStorage.setItem('fixture-cloud',JSON.stringify(cloud))}};
document.getElementById('en').onclick=()=>SPM_LANGUAGE.set('en');document.getElementById('es').onclick=()=>SPM_LANGUAGE.set('es');document.getElementById('safety').onclick=()=>{blocked=!blocked;window.dispatchEvent(new Event('spm:adaptation'))};
document.getElementById('breath').onclick=()=>document.getElementById('breathing').innerHTML=SPM_BREATHING_VISUAL();document.getElementById('video').onclick=()=>SPM_NATIVE_VIDEO.open('../premium-v2/assets/videos/dr-spm-vascular.mp4','Salud vascular y función eréctil');
</script><script src="../premium-v2/spm-resources-content.js"></script><script src="../premium-v2/spm-resources.js"></script><script src="../premium-v2/spm-breathing-visual.js"></script><script src="../premium-v2/spm-inline-video-player.js"></script></html>
