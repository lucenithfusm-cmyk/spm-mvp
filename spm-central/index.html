<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071014">
<title>SPM Central — Acceso</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071014;color:#eef8f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(460px,94vw);border:1px solid #31545c;border-radius:22px;padding:28px;background:linear-gradient(145deg,#0a2530,#07161c);text-align:center;box-shadow:0 28px 80px #0008}.logo{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;display:grid;place-items:center;background:#64e3c2;color:#05221a;font-weight:900;font-size:24px}.card h1{margin:8px 0 10px}.card p{color:#b7cbcd;line-height:1.55}.btn{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:13px;background:#64e3c2;color:#05221a;text-decoration:none;font-weight:850}
</style>
</head>
<body>
<main class="card" aria-live="polite">
<div class="logo">S</div>
<h1>SPM Central</h1>
<p>Abriendo tu acceso seguro. Si no continúa automáticamente, usa el botón.</p>
<a id="fallback" class="btn" href="../premium-v2/live.html">Entrar a SPM Central</a>
</main>
<script>
(()=>{
  const target=new URL('../premium-v2/live.html',location.href);
  target.search=location.search;
  target.hash=location.hash;
  document.getElementById('fallback').href=target.href;
  location.replace(target.href);
})();
</script>
</body>
</html>
