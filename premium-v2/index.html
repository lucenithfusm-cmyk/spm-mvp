<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Abriendo tu programa · SPM</title>
  <style>body{margin:0;background:#07171f;color:#f3f5f5;font:17px/1.7 system-ui,sans-serif}main{max-width:520px;margin:12vh auto;padding:28px}h1{font-size:28px;line-height:1.3}a{display:inline-block;color:#dfc18f;min-height:44px;padding:8px 0}a:focus-visible{outline:2px solid #dfc18f;outline-offset:4px}</style>
</head>
<body>
  <main>
    <h1>Tu programa SPM</h1>
    <p>Abriendo la versión actual de tu programa…</p>
    <p><a id="currentProgram" href="/premium-v2/live.html">Abrir mi programa</a></p>
  </main>
  <script>
  (()=>{
    'use strict';
    const target='/premium-v2/live.html'+location.search+location.hash;
    document.getElementById('currentProgram').setAttribute('href',target);
    location.replace(target);
  })();
  </script>
</body>
</html>
