 if(page===1){html+=headCustom(7,1,'Tu primera semana','Revisa tus experiencias y elige qué llevar contigo.');
  const summary=[['Explora sin exigencia',1],['Patrón y contextos',2],['Respirar y soltar presión',3],['Atención sin examen',4],['Aceleradores y frenos',5],['Conciencia corporal',6]];
  html+=`<div class="custom-pad"><div class="panel" style="text-align:center">${speaker('7-1')}<div class="week-hero"><strong>7</strong><span>días para observarte</span></div><p>Lo importante es reconocer qué descubriste, sin calificar tu desempeño.</p></div><div class="panel"><h2>Recuerda tu recorrido</h2><div class="week-timeline">${summary.map(([label,day])=>`<div class="timeline-row"><i>${day}</i><span>${esc(label)}</span>${data['d'+day]?.completed?'<strong>✓</strong>':''}</div>`).join('')}</div></div><div class="panel">${field('d7','good','Una experiencia que disfruté','Un momento, sensación o detalle agradable...')}${field('d7','adjust','Una experiencia que adaptaré','¿Qué preferirías cambiar?')}</div>${cta('Explorar mis preferencias')}<p class="below-note">Si no tienes registros de la semana, puedes partir de un recuerdo.</p></div>`;
 }
 if(page===2){html+=headCustom(7,2,'Tu lista de excitación','Elige lo que te gusta y ordena hasta cinco prioridades.');
  html+=`<div class="custom-pad"><div class="panel">${speaker('7-2')}<p>Marca solo lo que reconozcas. Las preferencias pueden cambiar.</p><div class="captionline">Lo que me gusta</div><div class="option-grid">${ranks.map(([id,label])=>`<button type="button" data-action="liked" data-value="${id}" aria-pressed="${s.liked.includes(id)}"><span>${s.liked.includes(id)?'✓':''}</span>${esc(label)}</button>`).join('')}</div></div><div class="panel"><h2>Mis 5 prioridades</h2><p>Usa + para añadir y las flechas para ordenar. Nunca se eligen por ti.</p>${s.ranking.length?`<ol class="list-ranked">${s.ranking.map((id,i)=>`<li><span class="n">${i+1}</span><span class="txt">${esc(ranks.find(r=>r[0]===id)?.[1]||id)}</span><button type="button" data-action="rank-up" data-value="${id}" aria-label="Subir prioridad" ${i===0?'disabled':''}>↑</button><button type="button" data-action="rank-down" data-value="${id}" aria-label="Bajar prioridad" ${i===s.ranking.length-1?'disabled':''}>↓</button><button type="button" data-action="rank-remove" data-value="${id}" aria-label="Eliminar prioridad">×</button></li>`).join('')}</ol>`:`<div class="status-persist">Todavía no has elegido prioridades. Selecciona un estímulo y pulsa +.</div>`}
  <div class="option-grid">${s.liked.filter(id=>!s.ranking.includes(id)).map(id=>`<button type="button" data-action="rank-add" data-value="${id}" ${s.ranking.length>=5?'disabled':''}><span>+</span>${esc(ranks.find(r=>r[0]===id)?.[1]||id)}</button>`).join('')}</div></div><div class="panel"><button class="mini-action" data-action="resource" style="width:100%">⌁ Abrir biblioteca de Deseo</button><p class="muted" style="font-size:11px">Consulta las preferencias y recursos existentes, sin duplicar actividades.</p></div>${cta('Ver mi síntesis')}</div>`;
 }
 if(page===3){html+=headCustom(7,3,'Lo que me llevo','Una elección sencilla para comenzar la segunda semana.');
  html+=`<div class="custom-pad"><div class="panel" style="text-align:center">${speaker('7-3','Escuchar cierre')}<div class="week-hero"><strong>1–5</strong><span>prioridades personales</span></div><p>Conservar, adaptar y explorar a tu ritmo.</p></div><div class="panel"><h2>Mis preferencias hoy</h2>${s.ranking.length?`<ol class="list-ranked">${s.ranking.map((id,i)=>`<li><span class="n">${i+1}</span><span class="txt">${esc(ranks.find(r=>r[0]===id)?.[1]||id)}</span></li>`).join('')}</ol>`:'<p>Aún no elegiste prioridades. Puedes volver y añadirlas.</p>'}<div class="summary-highlight"><b>Mi experiencia de la semana</b><p>${s.good?esc(s.good):'Puedes recordar una experiencia agradable.'}</p><p>${s.adjust?'Quiero adaptar: '+esc(s.adjust):''}</p></div></div><div class="panel">${field('d7','next','¿Qué te gustaría repetir o explorar en la semana 2?','Mi siguiente paso será...')}</div>${cta('Guardar mi síntesis','complete')}<p class="below-note">Tus observaciones ayudan a elegir la próxima práctica sin imponer una meta.</p></div>`;
 }
 return html+'</div>'+nav(7,page,3);
}
function home(){const thumbs={4:asset('d4-1'),5:asset('d5-1'),6:asset('d6-anatomia-original')};let h=`${top('4–7')}<div class="home"><section class="hero-home"><span class="eyebrow">Semana 1 · Versión de revisión</span><h1>Deseo en movimiento</h1><p>Cuatro días preparados para experimentar la estética premium, escuchar cada guía y probar los controles táctiles.</p></section><section class="week-map">`;
 for(const day of [4,5,6,7])h+=`<button type="button" class="day-card" data-action="open-day" data-value="${day}">${day===7?'<div class="thumb" style="background:linear-gradient(135deg,#9fb89e,#f8e8bc);display:grid;place-items:center"><span class="number">7</span></div>':`<img class="thumb" src="${thumbs[day]}" alt="">`}<div><span class="eyebrow">Día ${day} · ${data['d'+day]?.completed?'Registro piloto ✓':'Por revisar'}</span><strong>${esc(names[day])}</strong><small>${day===4?'Sensaciones · 5 min':day===5?'Mapa interactivo · selecciones':day===6?'Figura corporal con zonas táctiles':'Balance y prioridades personales'}</small></div><span class="go">›</span></button>`;
 return h+`</section><div class="home-foot"><strong>Nota:</strong> esto es una vista piloto local, no el programa de un paciente. No sustituye SPM Central ni modifica sus rutas aprobadas.</div></div>`;
}
function render(keep=false){const y=window.scrollY;const day=data.day;const page=data.pages[day];root.innerHTML=day===0?home():day===4?page4(page):day===5?page5(page):day===6?page6(page):page7(page);save();requestAnimationFrame(()=>{if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);});}
function setDay(day){
 if(CENTRAL){
  if(day===0){if(!closing){closing=true;pauseBoth();stopVoice();transmit('SPM_WEEK1_CLOSE',{record:data['d'+CENTRAL_DAY]});}return;}
  if(day!==CENTRAL_DAY)return;
 }
 if(day!==0&&![4,5,6,7].includes(day))return;
 pauseBoth();stopVoice();data.day=day;render(false);
}
let spoken=null;
function stopVoice(){try{window.SPM_VOICE?.cancel();}catch{} spoken=null;}
function speak(text){if(!text)return;try{if(!('speechSynthesis'in window)){inform('La voz del dispositivo no está disponible. Puedes leer las instrucciones de la pantalla.');return;}window.SPM_VOICE.cancel();const msg=new SpeechSynthesisUtterance(text);msg.lang='es-CO';msg.rate=.91;msg.pitch=1.0;spoken=msg;msg.onerror=e=>{if(spoken===msg&&e.error!=='canceled'&&e.error!=='interrupted')inform('No se pudo reproducir la voz. La guía está disponible en pantalla.');};window.SPM_VOICE.speak(msg);}catch{inform('La narración no está disponible en este dispositivo.');}}
function pauseTimer(k){const t=data[k].timer;if(!t.running)return;t.running=false;t.anchor=0;save();syncTimer();}
function pauseBoth(){pauseTimer('d4');pauseTimer('d6');}
function startTimer(){const k=timerKey(),t=data[k].timer;if(t.running)return;if(t.elapsed>=300){inform('Este cronómetro terminó. Pulsa reiniciar si quieres repetirlo.');return;}t.started=true;t.running=true;t.anchor=Date.now();save();if(k==='d4')speak(phases4[Math.min(3,Math.floor(t.elapsed/75))]);else if(data.d6.region===null){data.d6.region=0;speak(regions[0][1]);}else speak(regions[data.d6.region][1]);syncTimer();}
function tick(){let any=false;for(const k of ['d4','d6']){let t=data[k].timer;if(!t.running)continue;let now=Date.now(),dt=Math.min(5,Math.max(0,(now-t.anchor)/1000));if(!Number.isFinite(dt)||!dt)continue;let old=Math.min(3,Math.floor(t.elapsed/75));t.elapsed=Math.min(300,t.elapsed+dt);t.anchor=now;let next=Math.min(3,Math.floor(t.elapsed/75));if(next!==old&&t.elapsed<300){if(k==='d4'&&data.day===4&&data.pages[4]===2)speak(phases4[next]);else if(k==='d6'&&data.day===6&&data.pages[6]===2){data.d6.region=next;root.querySelectorAll('[data-action="region"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.value)===next)));speak(regions[next][1]);} }if(t.elapsed>=300){t.running=false;t.anchor=0;inform('Cinco minutos realizados. Puedes registrar tu experiencia y guardar.');}any=true;}if(any){syncTimer();save();}}
function syncTimer(){for(const k of ['d4','d6']){root.querySelectorAll(`[data-clock="${k}"]`).forEach(n=>n.textContent=clock(k));root.querySelectorAll(`[data-progress="${k}"]`).forEach(n=>n.style.width=Math.min(100,data[k].timer.elapsed/300*100)+'%');}}
function move(delta){const day=data.day;if(day===0)return;const p=data.pages[day],n=3;stopVoice();const to=Math.max(1,Math.min(n,p+delta));if(to===p){if(delta<0)setDay(0);else inform('Ya estás en la última pantalla.');return;}if(day===4&&p===2&&to===3)pauseTimer('d4');if(day===6&&p===2&&to===3)pauseTimer('d6');data.pages[day]=to;render();}
function finish(){const day=data.day;if(day===4&&!data.d4.timer.started){inform('Inicia la práctica de atención antes de registrar el día. Puedes finalizarla antes de cinco minutos.');return;}if(day===6&&!data.d6.timer.started){inform('Inicia el recorrido corporal antes de guardarlo. El tiempo de cinco minutos es orientativo.');return;}if(day===7&&!data.d7.good.trim()&&!data.d7.adjust.trim()&&!data.d7.next.trim()&&!data.d7.ranking.length){inform('Registra al menos una observación o una preferencia para tu síntesis.');return;}pauseBoth();stopVoice();
 if(CENTRAL){
  if(closing)return;
  closing=true;data['d'+day].completed=true;
  transmit('SPM_WEEK1_COMPLETE',{record:data['d'+day]});
  inform('Guardando tu práctica en SPM Central…');return;
 }
 data['d'+day].completed=true;save();inform(`Día ${day} guardado en la vista de prueba. El programa central permanece intacto.`);setTimeout(()=>setDay(0),650);}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!root.contains(b))return;const a=b.dataset.action,v=b.dataset.value;switch(a){
 case 'home':setDay(0);break;case 'open-day':setDay(Number(v));break;case 'back':case 'prev':move(-1);break;case 'next':move(1);break;
 case 'speak':speak(texts[v]||'');break;case 'speak-text':speak(b.dataset.text||'');break;
 case 'metric':{const k=b.dataset.kind,f=b.dataset.field;if(!data[k]||!['before','after'].includes(f))return;data[k][f]=v==='null'?null:Number(v);data[k].metricTouched={...data[k].metricTouched,[f]:true};render(true);break;}
 case 'choose-feel':data.d4.feel=v;render(true);break;
 case 'choice':{const key=b.dataset.kind;if(!['accel','brakes'].includes(key))return;let arr=data.d5[key];data.d5[key]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];data.d5.aIndex=0;data.d5.bIndex=0;render(true);break;}
 case 'cycle-plan':{const k=b.dataset.kind,arr=data.d5[k]||[];if(!arr.length){inform('Primero marca una opción en el mapa.');return;}const index=k==='accel'?'aIndex':'bIndex';data.d5[index]=(data.d5[index]+1)%arr.length;render(true);break;}
 case 'play-timer':startTimer();break;case 'pause-timer':pauseTimer(timerKey());inform('Cronómetro pausado.');break;case 'reset-timer':{const k=timerKey();pauseTimer(k);data[k].timer={elapsed:0,started:false,running:false,anchor:0};render(true);break;}
 case 'view':data.d6.view=v==='back'?'back':'front';render(true);break;
 case 'region':{let i=Number(v);if(i<0||i>3)return;data.d6.region=i;render(true);speak(regions[i][1]);break;}
 case 'comfort-zone':data.d6.comfortZone=Number(v);render(true);break;
 case 'resource':if(CENTRAL){if(!closing){closing=true;transmit('SPM_WEEK1_RESOURCE',{record:data['d'+CENTRAL_DAY]});inform('Abriendo biblioteca SPM…');}}else inform('El recurso clínico se encuentra en la biblioteca original de SPM Central.');break;
 case 'liked':{let z=data.d7;if(z.liked.includes(v)){z.liked=z.liked.filter(x=>x!==v);z.ranking=z.ranking.filter(x=>x!==v);}else z.liked.push(v);render(true);break;}
 case 'rank-add':{const z=data.d7;if(!z.liked.includes(v)||z.ranking.length>=5||z.ranking.includes(v))return;z.ranking.push(v);render(true);break;}
 case 'rank-remove':data.d7.ranking=data.d7.ranking.filter(x=>x!==v);render(true);break;
 case 'rank-up':case 'rank-down':{let z=data.d7.ranking,i=z.indexOf(v),j=i+(a==='rank-up'?-1:1);if(i<0||j<0||j>=z.length)return;[z[i],z[j]]=[z[j],z[i]];render(true);break;}
 case 'complete':finish();break;
 default:break;
 }});
root.addEventListener('input',e=>{const t=e.target,k=t.dataset?.kind,f=t.dataset?.field;if(!k||!f||!data[k]||typeof data[k][f]!=='string')return;data[k][f]=t.value.slice(0,400);save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseBoth();stopVoice();}});
window.addEventListener('pagehide',()=>{pauseBoth();stopVoice();});
setInterval(tick,250);
window.SPM_DESIRE_REVIEW={get state(){return JSON.parse(JSON.stringify(data));},get curriculumIds(){return plans;},go:day=>setDay(Number(day)),reset:()=>{pauseBoth();stopVoice();data=make();save();setDay(0);}};
// Sesión clínica verificada por el SPM Central: no utiliza datos locales ni permite cambiar de día.
if(CENTRAL){
 if(!CENTRAL_VALID){root.innerHTML='<p class="view-status">No es posible abrir esta sesión de SPM. Regresa a tu programa.</p>';}
 else{
  root.innerHTML='<p class="view-status">Recuperando tu práctica de Deseo…</p>';
  window.addEventListener('message',event=>{
   if(event.origin!==window.location.origin||event.source!==window.parent||event.data?.sid!==SESSION)return;
   const message=event.data;
   if(message.type==='SPM_WEEK1_INIT'&&Number(message.day)===CENTRAL_DAY){
    if(ready)return;
    const key='d'+CENTRAL_DAY,record=message.record&&typeof message.record==='object'?message.record:{};
    data[key]={...data[key],...record};
    if([4,6].includes(CENTRAL_DAY))data[key].timer={...data[key].timer,...record.timer,running:false,anchor:0};
    data.day=CENTRAL_DAY;data.pages[CENTRAL_DAY]=1;ready=true;render(false);
   }else if(message.type==='SPM_WEEK1_ERROR'){
    closing=false;data['d'+CENTRAL_DAY].completed=false;
    inform(typeof message.message==='string'?message.message:'No pudimos guardar el avance. Reintenta.');
   }else if(message.type==='SPM_WEEK1_DONE'){
    inform('Tu práctica quedó guardada en SPM Central.');
   }
  });
  transmit('SPM_WEEK1_READY');
 }
}else{data.day=0;render(false);}
})();

</script>
</body>
