<title>SPM · Revisión · Erección y firmeza · Día 2</title>
<link rel="stylesheet" href="erection-day2-touch-v1.css?v=20261116-day2-touch1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#081d32;color:#f4f8fa;font-family:system-ui,-apple-system,sans-serif}
header{max-width:560px;margin:0 auto;padding:13px 14px 10px}
header strong{color:#e9c889;font-size:11px;letter-spacing:.09em}
header h1{font-size:clamp(19px,5vw,24px);margin:6px 0 4px}
header p{font-size:12px;line-height:1.4;color:#c6dde7;margin:0 0 9px}
header button{padding:9px 13px;min-height:42px;border:1px solid #cda96c;border-radius:12px;background:#19435d;color:white;font:inherit;font-size:13px;cursor:pointer}
main{max-width:560px;margin:auto;padding:0 8px 30px}
.spm-ed2-session{border:1px solid #e4c18666}
</style>
</head>
<body>
<header><strong>SPM · ENTORNO DE REVISIÓN</strong><h1>Erección y firmeza · Día 2</h1><p>Cuatro imágenes interactivas con audios y selecciones. Datos simulados; no modifica pacientes, pagos ni el programa público.</p><button type="button" id="reset">↻ Reiniciar recorrido</button></header>
<main id="spmDailyWorkspace"></main>
<script src="erection-day2-touch-v1.js?v=20261116-day2-touch1"></script>
<script>
(()=>{'use strict';
let record=null;
function restart(){window.SPM_ED_DAY2_TOUCH.mount({
 host:document.getElementById('spmDailyWorkspace'),scope:'spm-review:day2',prior:{},valid:()=>true,
 save:async r=>{if(r.day!==2||r.erectionPracticeVersion!==1||!r.confirmed||!['spontaneous','solo','partner'].every(k=>['easy','variable','difficult','not_evaluable'].includes(r.contexts?.[k]))||!['initiate','maintain','recover','none','not_evaluable'].includes(r.responseAspect)||!r.contextPlan)throw Error('Registro de prueba inválido');record=r;return {ok:true}},
 onBack:()=>{document.getElementById('reset')?.focus();restart()}
 });}
document.addEventListener('DOMContentLoaded',()=>{restart();document.getElementById('reset').onclick=restart});
window.SPM_ED2_REVIEW={getRecord:()=>record,reset:restart};
})();
</script>
</body></html>
