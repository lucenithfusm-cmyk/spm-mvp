<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confianza y Ansiedad de Desempeño · Recorrido de prueba</title><link rel="stylesheet" href="ep-bloque/screen.css"><style>*{box-sizing:border-box}body{margin:0;background:#083e37;color:#fff9ec;font:16px/1.45 system-ui}main{max-width:540px;margin:auto;padding:24px 16px}h1{font-size:1.8rem}nav{display:grid;gap:8px}nav button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid #dfcb95;border-radius:16px;background:#fcf4e5;color:#133d36;padding:12px;font:650 16px system-ui}nav b{min-width:55px;color:#6f551f}</style><main><h1>Confianza y Ansiedad de Desempeño</h1><p>Elige un día para probarlo. Al guardar, pasarás al siguiente día del bloque.</p><nav></nav></main><script src="modules.js"></script><script src="practice-audio-v1.js"></script><script src="ep-bloque/voice.js"></script><script src="ep-bloque/screen.js"></script><script>
const {days,titles,open:openDay}=SPM_CONFIDENCE_TOUCH,nav=document.querySelector('nav');
const key='spm-ep-block-review-v1';
function records(){return JSON.parse(sessionStorage.getItem(key)||'{}');}
function show(index){
 const day=days[index];
 openDay({host:document.body,day,prior:records()[day],exit:menu,save:async result=>{
  sessionStorage.setItem(key,JSON.stringify({...records(),[day]:result}));
  queueMicrotask(()=>index+1<days.length?show(index+1):menu());
 }});
}
function menu(){nav.replaceChildren();days.forEach((day,i)=>{
 const button=document.createElement('button');button.innerHTML='<b>Día '+day+'</b>';button.append(titles[i]+(records()[day]?' ✓':''));button.onclick=()=>show(i);nav.append(button);
});}
menu();
const direct=days.indexOf(Number(new URLSearchParams(location.search).get('dia')));if(direct>=0)show(direct);
</script></html>
