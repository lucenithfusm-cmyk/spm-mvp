<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPM · Conexión y Satisfacción Sexual</title>
<link rel="stylesheet" href="conexion-satisfaccion/pantalla.css">
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#173c49;font:16px/1.45 system-ui}main{max-width:580px;margin:auto;padding:28px 18px 48px}main header{border-top:4px solid #a88749;padding:22px 0 0}main small{color:#74613d;letter-spacing:.1em;font-size:11px;font-weight:750}h1{font:normal clamp(32px,8vw,50px)/1.04 Georgia,serif;margin:10px 0}h2{font-size:14px;color:#5b695f;margin:22px 0 6px}nav button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fffdf8;border:1px solid #d7dacb;border-radius:12px;padding:12px;color:#163d48;font:600 16px system-ui;margin:6px 0;cursor:pointer}nav b{color:#74613d;min-width:52px;font-size:14px}nav span{margin-left:auto;color:#8c6b2b}</style></head>
<body><main><header><small>SPM DIGITAL WELLNESS</small><h1>Conexión y Satisfacción Sexual</h1><p>Elige una actividad para probarla. Las respuestas de revisión se guardan en esta pestaña.</p></header><nav aria-label="Actividades por semana"></nav></main>
<script src="practice-audio-v1.js"></script><script src="conexion-satisfaccion/guiones.js"></script><script src="conexion-satisfaccion/actividades.js"></script><script src="conexion-satisfaccion/pantalla.js"></script>
<script>
const key='spm-conexion-revision-1',nav=document.querySelector('nav');
let records={};try{records=JSON.parse(sessionStorage.getItem(key)||'{}');}catch{}
function openDay(day){
  SPM_CONNECTION.open({day,host:document.body,prior:records[day],draftScope:'revision',baseline:records[1]?.answers,exit:menu,
    save:async record=>{const next={...records,[day]:record};try{sessionStorage.setItem(key,JSON.stringify(next));}catch{document.querySelector('header p').textContent='Las respuestas estarán disponibles mientras esta revisión siga abierta.';}records=next;menu();}
  });
}
function menu(){
 nav.replaceChildren();let week=0;
 for(const day of SPM_CONNECTION.days){
  if(Math.ceil(day/7)!==week){week=Math.ceil(day/7);const h=document.createElement('h2');h.textContent='Semana '+week;nav.append(h);}
  const b=document.createElement('button'),d=document.createElement('b'),state=document.createElement('span');
  d.textContent='Día '+day;state.textContent=records[day]?'✓':'›';b.append(d,SPM_CONNECTION_GUIDES[day].title,state);b.onclick=()=>openDay(day);nav.append(b);
 }
}
menu();const day=Number(new URLSearchParams(location.search).get('dia'));if(SPM_CONNECTION.days.includes(day))openDay(day);
</script></body></html>
