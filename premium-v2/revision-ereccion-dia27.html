<div id="spmDailyWorkspace"></div>
<section class="review-home" id="reviewEnd" hidden><h1>Revisión finalizada</h1><p id="endMessage"></p><button type="button" id="reviewAgain">Volver a revisar el Día 27</button></section>

<script>
(()=>{'use strict';
 const key='SPM_ED10_REVIEW_ONLY_20261118',host=document.getElementById('spmDailyWorkspace');
 const done=document.getElementById('reviewEnd'),message=document.getElementById('endMessage');
 window.SPM_RESOURCE_CONTEXT=()=>({userId:'review-only',planId:'day27',day:27,primary:'erection'});
 function read(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}
 function finish(saved){window.SPM_ED_DAY10_TOUCH.stop();host.replaceChildren();done.hidden=false;
  message.textContent=saved?'Guardaste una selección de prueba solo en este navegador. No se modificaron registros de pacientes ni el programa publicado.':'Saliste de la revisión sin modificar los registros del programa.';
  window.scrollTo(0,0)}
 async function start(){done.hidden=true;let saved=false;
  window.SPM_ED_DAY10_TOUCH.mount({host,prior:read(),calendarDay:27,scope:'review-only:day27',valid:()=>host.isConnected,
   save:async record=>{localStorage.setItem(key,JSON.stringify(record));saved=true;return true},onBack:()=>finish(saved)});
 }
 document.getElementById('reviewAgain').addEventListener('click',start);start();
})();
</script></body></html>
