<script>(()=>{'use strict';const key='SPM_CHECKPOINT_DEMO_ONLY_20261118';const baseline={checkpointVersion:2,scaleMax:4,milestone:1,submittedDay:1,metrics:{firmness:2,control:null,desire:2,confidence:2,comfort:2,sleep:2,skill:2},reflection:'Ejemplo ilustrativo',continuity:'Practicar según la ruta',at:'2026-11-01T00:00:00.000Z'};const c={userId:'demo-visual-only',planId:'checkpoints-visual',day:14,primary:'erection'};const clone=x=>JSON.parse(JSON.stringify(x));const stored=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};const records=()=>({...stored(),1:baseline});const message=document.getElementById('reviewStatus');window.SPM_RESOURCE_CONTEXT=()=>c;window.SPM_DAILY_RECORDS={read:async(_,day)=>records()[day]?{'program-checkpoint':clone(records()[day])}:{},readCheckpoints:async()=>Object.entries(records()).map(([day,metadata])=>({day_number:Number(day),metadata:clone(metadata)}))};window.SPM_DAILY_PRACTICE={active:()=>({id:'program-checkpoint',day:c.day,scope:c.userId+':'+c.planId}),open:()=>{},saveActivity:async(id,record,scope,day)=>{if(id!=='program-checkpoint'||scope!==c.userId+':'+c.planId||day!==c.day)throw Error('Contexto de prueba cambiado');let r=stored();r[day]=clone(record);localStorage.setItem(key,JSON.stringify(r));message.textContent='Respuestas guardadas solo en este navegador de revisión.';return true}};async function view(day){c.day=day;window.SPM_CHECKPOINT_TOUCH?.stop();document.querySelectorAll('[data-check-day]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.checkDay)===day)));message.textContent='Día '+day+' · Evaluación visual de prueba';await window.SPM_PROGRAM_CHECKPOINT.open({id:'program-checkpoint',kind:'program-checkpoint',title:'Evaluación SPM'},true)}document.querySelectorAll('[data-check-day]').forEach(b=>b.addEventListener('click',()=>view(Number(b.dataset.checkDay))));view(14)})();</script></body></html>
