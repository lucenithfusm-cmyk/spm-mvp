<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>SPM · Día 21 · Sostener la erección · Revisión táctil</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="erection-day8-touch-v1.css?v=20261117-d21-review-1">
  <link rel="stylesheet" href="erection-fullscreen-v1.css?v=20261117-er-fullscreen-cierre1">
  <style>
   :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
   *{box-sizing:border-box}
   html,body{margin:0;min-height:100%;background:#08253f;color:#fff}
   body{display:flex;flex-direction:column;align-items:center}
   .header{width:100%;padding:13px;text-align:center;background:#0e3b59;color:#f5d38d;border-bottom:1px solid #debd8a}
   .header strong{font-size:15px;letter-spacing:.02em}
   .header p{font-size:12px;margin:6px 0 0;color:#d5e7f4}
   .review-home{width:min(92%,490px);margin:12vh auto;background:#123a57;padding:24px;border:1px solid #dcbd81;border-radius:22px;text-align:center}
   .review-home h1{font-size:24px;margin:4px 0 14px}
   .review-home p{font-size:14px;color:#d7e6f0;line-height:1.6}
   .review-home button{min-height:50px;width:100%;padding:10px;border:0;border-radius:13px;font-weight:850;font-size:16px;background:#f2ce80;color:#183b54;cursor:pointer}
   .review-home[hidden]{display:none}
  </style>
</head>
<body>
  <header class="header"><strong>SPM DIGITAL WELLNESS · REVISIÓN PRIVADA</strong><p>Erección y firmeza · Día 21 · Sesión 8 de 10</p></header>
  <div id="spmDailyWorkspace"></div>
  <section class="review-home" id="reviewEnd" hidden aria-label="Resultado de revisión">
    <h1>Revisión finalizada</h1>
    <p id="endMessage"></p>
    <button id="reviewAgain" type="button">Volver a revisar el Día 21</button>
  </section>
  <script src="erection-fullscreen-v1.js?v=20261117-er-fullscreen-cierre1"></script>
  <script src="erection-day8-touch-v1.js?v=20261117-d21-review-1"></script>
  <script>
   (()=>{'use strict';
    const key='SPM_ED8_REVIEW_ONLY_20261117';
    const host=document.getElementById('spmDailyWorkspace');
    const end=document.getElementById('reviewEnd');
    const endMessage=document.getElementById('endMessage');
    window.SPM_RESOURCE_CONTEXT=()=>({userId:'review-only',planId:'day21',day:21,primary:'erection'});
    function read(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}
    function finish(saved){
     window.SPM_ED_DAY8_TOUCH.stop();host.replaceChildren();
     end.hidden=false;
     endMessage.textContent=saved?'Tus respuestas se guardaron únicamente en este navegador de revisión. No se modificó el programa ni los registros de ningún paciente.':'Saliste de la práctica de revisión sin modificar el programa.';
     window.scrollTo(0,0);
    }
    async function start(){
     end.hidden=true;let savedThisVisit=false;
     window.SPM_ED_DAY8_TOUCH.mount({
      host,prior:read(),calendarDay:21,scope:'review-only:day21',valid:()=>host.isConnected,
      save:async record=>{localStorage.setItem(key,JSON.stringify(record));savedThisVisit=true;return true},
      onBack:()=>finish(savedThisVisit)
     });
    }
    document.getElementById('reviewAgain').addEventListener('click',start);
    start();
   })();
  </script>
</body>
</html>
