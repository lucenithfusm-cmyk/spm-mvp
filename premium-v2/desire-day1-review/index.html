<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103e35"><meta name="robots" content="noindex,nofollow">
<title>SPM · Deseo · Día 1 · Revisión táctil</title>
<style>body{margin:0;background:#0d392f;color:#f8f0df;font-family:system-ui,-apple-system,sans-serif}body>header{background:#103e36;text-align:center;padding:15px 8px;font-size:13px;letter-spacing:.09em;font-weight:bold}#test-overview{max-width:440px;margin:14px auto;padding:20px;background:#f6efe5;color:#164238;border-radius:15px}#test-overview button{display:block;width:100%;padding:14px;margin:12px 0 0;border-radius:25px;border:0;background:#d2a555;color:#153b33;font-weight:750;font-size:16px}#reviewMode{margin:0 auto;max-width:440px;color:#dbe7df;text-align:center;font-size:12px;padding:6px 12px}#workspace{max-width:440px;margin:0 auto;}/* SPM Deseo Día 1: capas de interacción transparentes sobre imágenes aprobadas 9:16 */
.spm-ds1-session{box-sizing:border-box;max-width:440px;margin:0 auto 24px;background:#f7f1e9;color:#143f36;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;isolation:isolate}
.spm-ds1-session *{box-sizing:border-box}
.spm-ds1-art{position:relative;width:100%;aspect-ratio:9/16;background:#eaded0;overflow:hidden;line-height:0}
.spm-ds1-art>img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.spm-ds1-hit{position:absolute;z-index:3;border:0;padding:0;margin:0;color:transparent;font-size:0;background:transparent;cursor:pointer;outline-offset:-3px;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.spm-ds1-hit:focus-visible{outline:3px solid #115f54;background:rgba(230,193,111,.12)}
.spm-ds1-hit:active{background:rgba(26,106,89,.10)}
.spm-ds1-mark{position:absolute;z-index:2;display:grid;place-items:center;pointer-events:none;background:transparent;color:#14634f;border:0;border-radius:0;font-size:24px;line-height:1;text-shadow:0 1px 2px #fff9ef;font-weight:800}
.spm-ds1-selected{position:absolute;z-index:2;pointer-events:none;border:3px solid rgba(12,99,77,.83);border-radius:999px;background:rgba(53,148,118,.15);box-shadow:0 1px 7px #5552}
.spm-ds1-glow{position:absolute;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 4px #116956;outline:2px solid #fff8;border-radius:55px}
.spm-ds1-clockbar{padding:11px 13px;background:#0a423a;color:#f6f3eb;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.spm-ds1-clock{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.spm-ds1-clock strong{font-size:25px;letter-spacing:.035em;font-variant-numeric:tabular-nums}
.spm-ds1-clock span:last-child{font-size:11px;opacity:.9}
.spm-ds1-clock-actions{display:flex;gap:7px;flex-wrap:wrap}
.spm-ds1-clock-actions button{border:1px solid #d4ba7c;border-radius:10px;padding:9px 12px;color:#fdf9ef;background:#1b6455;font-size:12px;font-weight:700;min-height:40px;cursor:pointer}
.spm-ds1-clock-actions button.spm-ds1-complete{background:linear-gradient(#f5d78d,#bb914c);color:#143f36;border-color:#ddbf79}
.spm-ds1-nav{display:flex;gap:5px;align-items:center;justify-content:space-between;padding:11px 8px 6px;background:#f8f1e9}
.spm-ds1-nav button{border:1px solid #b69a63;background:#fff9ee;color:#174b41;border-radius:15px;min-height:44px;padding:7px 10px;font-size:13px;font-weight:750;cursor:pointer;touch-action:manipulation}
.spm-ds1-nav span{font-size:12px;font-weight:700;color:#477165;white-space:nowrap}
.spm-ds1-bottom{display:flex;justify-content:space-between;gap:12px;padding:2px 11px 5px;background:#f8f1e9}
.spm-ds1-bottom button{border:0;background:transparent;color:#27665a;text-decoration:underline;text-underline-offset:3px;font-size:11px;min-height:36px;padding:3px;cursor:pointer}
.spm-ds1-bottom .spm-ds1-audio{text-decoration:none;font-weight:700}
.spm-ds1-status{margin:0;min-height:28px;padding:5px 13px 16px;font-size:12px;color:#0c4b42;line-height:1.4;background:#f8f1e9}
/* SPM: halos visibles antes del primer toque, sobre zonas funcionales de imágenes originales. */
.spm-ds1-hit:is([data-ds1-act="audio"],[data-ds1-act="form"],[data-ds1-act="step"],[data-ds1-act="stimulus"],[data-ds1-act="start"],[data-ds1-act="saveFirst"],[data-ds1-act="saveFinal"],[data-ds1-act="next"])::before{content:"";position:absolute;inset:4%;pointer-events:none;border:2px solid rgba(224,179,91,.75);border-radius:26px;box-shadow:0 0 10px 2px rgba(228,191,114,.32),inset 0 0 12px rgba(251,225,156,.24);opacity:.85;animation:spm-ds1-invite 2.6s ease-in-out infinite}
.spm-ds1-hit:is([data-ds1-act="audio"],[data-ds1-act="start"],[data-ds1-act="saveFirst"],[data-ds1-act="saveFinal"],[data-ds1-act="next"])::before{inset:4% 2%;border-radius:48px}
.spm-ds1-hit:is([data-ds1-act="form"],[data-ds1-act="stimulus"],[data-ds1-act="step"])::before{inset:5% 3%;border-radius:27px}
.spm-ds1-hit:is([data-ds1-act="observe"],[data-ds1-act="repeat"])::before{content:"";position:absolute;inset:9%;pointer-events:none;border:2px solid rgba(211,163,64,.64);border-radius:50px;box-shadow:0 0 7px rgba(227,188,95,.29);opacity:.75}
.spm-ds1-hit[data-ds1-val="resp"]::before,.spm-ds1-hit:is([data-ds1-act="step"],[data-ds1-act="stimulus"])[data-ds1-val="1"]::before{animation-delay:.7s}
.spm-ds1-hit:is([data-ds1-act="step"],[data-ds1-act="stimulus"])[data-ds1-val="2"]::before{animation-delay:1.4s}
.spm-ds1-hit:focus-visible::before{opacity:1!important;border-color:#0a6555!important}
.spm-ds1-clock-actions button,.spm-ds1-nav button[data-ds1-act="forward"],.spm-ds1-bottom button[data-ds1-act="audio"]{box-shadow:0 0 0 2px rgba(210,160,69,.3);animation:spm-ds1-nav-invite 2.8s ease-in-out infinite}
@keyframes spm-ds1-invite{0%,100%{opacity:.42;box-shadow:0 0 5px rgba(228,191,114,.2),inset 0 0 7px rgba(251,225,156,.12)}50%{opacity:.95;box-shadow:0 0 18px 3px rgba(228,191,114,.53),inset 0 0 11px rgba(251,225,156,.26)}}
@keyframes spm-ds1-nav-invite{0%,100%{box-shadow:0 0 0 2px rgba(210,160,69,.25)}50%{box-shadow:0 0 0 3px rgba(210,160,69,.75),0 0 12px rgba(210,160,69,.38)}}
@media(prefers-reduced-motion:reduce){.spm-ds1-hit::before{animation:none!important;opacity:.75!important}.spm-ds1-nav button,.spm-ds1-bottom button,.spm-ds1-clock-actions button{animation:none!important;box-shadow:0 0 0 2px rgba(210,160,69,.5)!important}}
@media(prefers-reduced-motion:reduce){.spm-ds1-session *{scroll-behavior:auto!important;animation:none!important}}
@media(max-width:330px){.spm-ds1-nav button{font-size:11px;padding:6px}.spm-ds1-clock-actions button{font-size:11px}}

</head>
<body><header>SPM DIGITAL WELLNESS · REVISIÓN INDEPENDIENTE</header>
<p id="reviewMode">Día 1 · Deseo · 5 pantallas originales · Simulación local, sin datos de pacientes</p>
<main id="test-overview"><h1>Actividades de hoy</h1><p>Deseo · Día 1. Selecciona «Abrir Día 1» para comprobar las cinco imágenes táctiles, las voces, los cronómetros y el guardado.</p><button id="testOpen" type="button">Abrir Día 1 · Deseo</button><button id="testReset" type="button">Reiniciar este ensayo</button><p id="testProgress" role="status"></p></main>
<div id="workspace" hidden></div>
<script src="../desire-day1-touch-v1.js?v=20261120-audio-fullscreen1"></script>
<script>
(()=>{'use strict';
const IMAGES=["/premium-v2/assets/desire-day1/screen-01.jpg", "/premium-v2/assets/desire-day1/screen-02.jpg", "/premium-v2/assets/desire-day1/screen-03.jpg", "/premium-v2/assets/desire-day1/screen-04.jpg", "/premium-v2/assets/desire-day1/screen-05.jpg"];
const KEY='spm-desire-day1-preview-v1',DAILY='spm-desire-day1-preview-main-v1';
const overview=document.getElementById('test-overview'),host=document.getElementById('workspace');
const storage={read:async()=>JSON.parse(localStorage.getItem(KEY)||'{}'),save:async obj=>{localStorage.setItem(KEY,JSON.stringify(obj));return true;}};
function summary(){const data=JSON.parse(localStorage.getItem(KEY)||'{}');let p={};try{p=JSON.parse(data['spm-desire-program']||'{}')}catch{}
 const first=p.sessions?.some(s=>s.practiceId==='presence-5'&&s.day===1&&s.status==='completed');
 const second=p.sessions?.some(s=>s.practiceId==='explore-new-stimulus'&&s.day===1&&s.status==='completed');
 document.getElementById('testProgress').textContent=second?'✓ Ambas prácticas de Deseo guardadas.':first?'✓ Primera práctica guardada. Falta la segunda.':'Todavía no has guardado las prácticas.';}
function toToday(){window.SPM_DESIRE_DAY1_TOUCH.pause();host.hidden=true;overview.hidden=false;summary();window.scrollTo(0,0);}
async function open(){overview.hidden=true;host.hidden=false;const ok=await window.SPM_DESIRE_DAY1_TOUCH.mount({host,storage,images:IMAGES,onBack:toToday,valid:()=>true,onCompleted:async record=>{localStorage.setItem(DAILY,JSON.stringify(record));}});if(!ok){host.innerHTML='<p role="alert">No se pudo cargar la revisión.</p>';}window.scrollTo(0,0);}
document.getElementById('testOpen').onclick=open;
document.getElementById('testReset').onclick=()=>{localStorage.removeItem(KEY);localStorage.removeItem(DAILY);window.SPM_DESIRE_DAY1_TOUCH.stop();summary();};
summary();
})();
</script></body></html>
