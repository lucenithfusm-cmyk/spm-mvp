<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>SPM · Stop/Start · Prototipo interactivo</title>
<style>
:root{--navy:#0f2e4f;--ink:#09213d;--gold:#c5a46c;--forest:#0d736b;--ivory:#f9f6f0;--line:#e4ddce;--bg:#e9eceb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3ef,#ecedf0);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);line-height:1.5}.outer{max-width:730px;margin:auto;padding:clamp(0px,2vw,20px)}.app{background:#fffdf9;min-height:100dvh;box-shadow:0 10px 42px #0f2e4f21;overflow:hidden;border-radius:clamp(0px,2vw,22px)}.top{z-index:10;position:sticky;top:0;background:#fffefaef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px 8px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.topname{font-weight:900;color:var(--navy);font-size:18px}.top small{color:#4a6867}.topright{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;color:#425e64;transform:translateY(9px);margin-right:4px}.meter{height:6px;background:#e1e7e6;border-radius:9px;overflow:hidden;margin:9px 0 0}.meter>span{display:block;height:100%;width:20%;background:linear-gradient(90deg,#046a64,#22ad8d);border-radius:9px;transition:width .25s}.voice{width:64px;height:64px;border:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f9e8bf 0%,#dcb771 65%,#c4a062 100%);color:#0f2e4f;box-shadow:0 0 0 2px #c5a46c75,0 6px 20px #c5a46c60;cursor:pointer;font-size:30px;animation:voicePulse 2.15s ease-in-out infinite;position:relative;flex:none;isolation:isolate;-webkit-tap-highlight-color:transparent}
.voice::before{content:'';position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 19px 8px #dcb773a6,0 0 0 5px #d7b47266;pointer-events:none;animation:voiceGlow 2.15s ease-in-out infinite;z-index:-1}
.voice.playing{animation:none;background:#d8b97e;box-shadow:0 0 0 3px #c5a46c99,0 0 17px 5px #c5a46c8c}
.voice.playing::before{animation:none;box-shadow:0 0 16px 5px #c5a46c85}
.voice:focus-visible{outline:3px solid #074d51;outline-offset:6px}
@keyframes voicePulse{0%,100%{transform:scale(1)}45%{transform:scale(1.22)}74%{transform:scale(.94)}87%{transform:scale(1.08)}}
@keyframes voiceGlow{0%,100%{opacity:.38;transform:scale(.92)}48%{opacity:1;transform:scale(1.16)}76%{opacity:.56;transform:scale(1.01)}}
.voice-hint{margin:11px 0 1px;padding:9px 11px;background:#faf6ed;border:1px solid #e8d7b3;border-radius:12px;font-size:12px;color:#3c5a60;line-height:1.45}
.voice-hint strong{color:#0f2e4f}.voice-hint[hidden]{display:none}
@media(max-width:420px){.voice{width:58px;height:58px;font-size:27px}#listen.voice{top:21px;right:21px}.topright{gap:7px;transform:none;margin-right:3px}.topname{font-size:17px}.top{padding-bottom:12px}}
@media(prefers-reduced-motion:reduce){.voice,.voice::before,.meter>span{animation:none!important;transition:none!important}}
.stage-shell{position:relative;max-width:560px;margin:0 auto}
#listen.voice{position:absolute;top:23px;right:21px;z-index:8}
.stage{max-width:560px;margin:0 auto;padding:10px 14px 32px}.poster{display:block;width:100%;height:auto;border-radius:6px}.slice{position:relative;overflow:hidden;width:100%;border-radius:6px}.slice img{position:absolute;display:block;top:0;left:0;width:100%;height:auto;max-width:none}.subcard{background:#fff;border-radius:20px;box-shadow:0 4px 25px #142f4020;border:1px solid #e7ddcf;padding:18px;margin:14px 0;display:grid;gap:12px}.subcard h3{margin:0;font-size:18px}.tiny{font-size:13px;color:#516b70}.cursive{font-style:italic;color:#6f7269}.gaugeWrap{margin:auto;max-width:480px;width:100%}.gauge{width:100%;height:auto;cursor:pointer;touch-action:none;display:block;outline:0}.gauge:focus-visible{outline:3px solid #c5a46c;outline-offset:3px;border-radius:12px}.gauge-value{font-size:25px;font-weight:900;text-align:center;color:var(--navy);margin:-10px 0 4px}.adjust{accent-color:#c8a04a;width:100%;height:26px;cursor:pointer}.gaugeStatus{font-size:13px;margin-top:0;text-align:center;color:#496365}.risk{color:#a6322c;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:var(--gold);color:var(--navy);border:1px solid #bea16b;border-radius:13px;padding:13px 14px;font:700 15px system-ui;min-height:52px;cursor:pointer}.btn.secondary{background:#fff;border-color:#789d93;color:#075857}.btn.dark{background:var(--navy);color:white;border:0}.btn:disabled{opacity:.45;cursor:not-allowed}.timer{font-size:clamp(36px,9vw,60px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--navy);text-align:center;letter-spacing:.02em;background:#f7f3ec;padding:12px;border-radius:17px}.count{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--navy)}.tag{display:inline-block;padding:5px 9px;border-radius:30px;font-weight:750;background:#e7f3ea;color:#126859;font-size:12px}.stops{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.stopDot{border-radius:50%;aspect-ratio:1;background:#eef0ee;border:2px solid #b9c5c4;color:#8da29d;display:grid;place-items:center;font-weight:800;font-size:14px}.stopDot.done{background:var(--forest);border-color:var(--forest);color:white}.field{display:grid;gap:7px}.field label{font-size:14px;color:var(--navy);font-weight:800}.field input,.field select,.field textarea{font:inherit;font-size:16px;border:1px solid #bfcfca;border-radius:11px;padding:11px;color:var(--navy);background:#fff;min-height:46px;width:100%}.field textarea{resize:vertical;min-height:86px}.notice{border-left:4px solid var(--gold);background:#f6f2e8;border-radius:10px;padding:11px 14px;font-size:13px;color:#47626b}.warning{color:#a44435}.nav{position:sticky;z-index:9;bottom:0;display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:12px;border-top:1px solid #e6dfd1;background:#fffefaef;backdrop-filter:blur(10px);padding:12px max(14px,env(safe-area-inset-right)) max(13px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.nav .btn{width:100%;font-size:15px}.nav .btn:not(.secondary){background:#c5a46c}.history li{font-size:13px;margin:8px 0}.copyright{font-size:11px;text-align:center;color:#74838b;padding:14px 10px 25px}.hidden{display:none!important}@media(max-width:420px){.outer{padding:0}.stage{padding:6px 8px 25px}.top{padding:9px 12px 7px}.subcard{border-radius:15px;padding:13px;margin:10px 2px}.nav{padding:9px 10px max(12px,env(safe-area-inset-bottom));gap:8px}}

const VOICES=["Bienvenido a la técnica Stop Start de control eyaculatorio. El objetivo es reconocer cómo aumenta tu excitación y detener la estimulación antes del punto de inevitabilidad. Busca privacidad, comodidad y un momento sin interrupciones. Es una práctica gradual: no necesitas alcanzar un tiempo exacto ni llegar al orgasmo. Activa la bocina para seguir las instrucciones de cada paso. Esta ruta tiene tres sesiones semanales en total, sin añadir prácticas extra.", "Observa la escala del cero al diez. Cero corresponde a ausencia de excitación y diez a un punto en el que la eyaculación es prácticamente inevitable. Entre cuatro y siete puedes reconocer la progresión y regular tu ritmo. Aproximadamente al acercarte a ocho, anticipa la parada antes de perder el control. El número es una referencia, no un examen. Mueve la aguja según tu percepción.", "La secuencia consta de cuatro momentos. Primero, comienza la autoestimulación de forma gradual y reconoce las señales que aparecen. Segundo, cuando te acerques a tu zona alta, detén por completo la estimulación. Tercero, respira normalmente y espera hasta notar un descenso claro de la excitación; no es necesario contar respiraciones exactas. Cuarto, cuando recuperes el control, reanuda de forma gradual. Una parada bien reconocida ya es progreso.", "Cuando estés preparado, toca Iniciar para activar el cronómetro. Desplaza la aguja de la escala conforme cambia tu excitación. Al acercarte a tu zona de anticipación detén completamente la estimulación; cuando hayas hecho una parada real, pulsa Registrar parada. Espera el descenso antes de volver a comenzar. Puedes pausar o reiniciar el cronómetro. No necesitas forzar las cuatro a seis paradas: son una meta progresiva.", "Es momento de registrar tu sesión. Revisa las paradas contabilizadas, tu nivel actual de excitación, cómo percibiste el control y, si quieres, deja una observación breve. Al tocar Guardar sesión, el registro de esta demostración se conserva solamente en este dispositivo. En SPM, el programa conectado utiliza el sistema de registro del paciente. Busca percepción y control, no perfección."];

const KEY='spm_stopstart_local_preview_v1';
try{stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(stored))stored=[]}catch{stored=[]}
function rawPhoto(index){return `<img class="poster" src="${POSTERS[index]}" alt="Lámina SPM Stop/Start ${index+1}: ${NAMES[index]}" decoding="async">`}
function imageSlice(index,start,end){const h=1672*(end-start);return `<div class="slice" style="aspect-ratio:941/${h.toFixed(3)}"><img src="${POSTERS[index]}" style="transform:translateY(-${(start*100).toFixed(4)}%)" alt="Ilustración SPM: ${NAMES[index]}" decoding="async"></div>`}
function makeGauge(){const c=['#14976e','#1aa580','#31b68e','#50bd94','#8ac86c','#d5d866','#f7d25f','#f3b94e','#ed8153','#e95b4c'];let seg='',labels='';const cx=150,cy=151,rad=113;for(let i=0;i<10;i++){const ang1=(180-i*18)*Math.PI/180,ang2=(180-(i+1)*18)*Math.PI/180,x1=cx+rad*Math.cos(ang1),y1=cy-rad*Math.sin(ang1),x2=cx+rad*Math.cos(ang2),y2=cy-rad*Math.sin(ang2);seg+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${rad} ${rad} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" stroke="${c[i]}" stroke-width="27" fill="none"/>`;}for(let i=0;i<=10;i++){const a=(180-i*18)*Math.PI/180,r=139,x=cx+r*Math.cos(a),y=cy-r*Math.sin(a)+5;labels+=`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" fill="${i>=8?'#aa3229':'#0d615d'}" font-size="12.5" font-weight="800" text-anchor="middle">${i}</text>`;}return `<div class="gaugeWrap"><svg class="gauge" viewBox="0 0 300 178" role="slider" tabindex="0" aria-label="Ajustar el nivel de excitación" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${arousal}"><title>Escala 0 a 10. Selecciona tu nivel de excitación moviendo la aguja.</title>${seg}${labels}<line class="needle" x1="150" y1="151" x2="150" y2="58" stroke="#0f2e4f" stroke-width="5.5" stroke-linecap="round"/><circle cx="150" cy="151" r="11" fill="#d1a650" stroke="#fff" stroke-width="3"/></svg><div class="gauge-value">Excitación <span data-arousal>${arousal}</span>/10</div><input class="adjust" type="range" min="0" max="10" step="1" value="${arousal}" aria-label="Nivel de excitación del 0 al 10"><p class="gaugeStatus" data-risk>${arousal>=8?'Zona alta: anticípate antes del punto de no retorno.':arousal<=3?'Observa con calma cómo cambian tus sensaciones.':'Reconoce el ascenso y regula con anticipación.'}</p></div>`}
function secondPage(){return imageSlice(1,0,.35)+`<section class="subcard" aria-label="Escala interactiva"><h3>Prueba la escala</h3>${makeGauge()}<div class="notice">Usa el control para mover la aguja. El 8/10 es una referencia aproximada: detente antes de sentir que la eyaculación ya es inevitable.</div></section>`+imageSlice(1,.71,1)}
function fourthPage(){return imageSlice(3,0,.24)+`<section class="subcard" aria-label="Práctica interactiva"><h3>Tu excitación actual</h3>${makeGauge()}<div class="timer" id="timer" aria-live="off">00:00</div><div class="actions"><button type="button" class="btn" id="timerBtn">▶ Iniciar</button><button type="button" class="btn secondary" id="resetBtn">↺ Reiniciar</button></div><div class="actions" style="align-items:center"><div><div class="tiny">Paradas registradas</div><div class="count" id="count">${stops}</div></div><button type="button" class="btn dark" id="registerBtn" ${!running?'disabled':''}>✓ Registrar parada</button></div><div id="stopGrid" class="stops">${Array.from({length:6},(_,i)=>`<span class="stopDot ${i<stops?'done':''}">${i<stops?'✓':i+1}</span>`).join('')}</div><p class="notice" id="trainingMsg">Una parada bien anticipada ya cuenta como progreso. La meta de 4–6 paradas es progresiva.</p></section>`+imageSlice(3,.71,1)}
function fifthPage(){const week=1,weekRows=stored.filter(r=>r.week===week);return imageSlice(4,0,.28)+`<section class="subcard"><h3>Registro de tu sesión</h3><div class="field"><label>Paradas realizadas</label><input type="number" id="stopsSummary" readonly value="${stops}" aria-label="Paradas realmente registradas durante la práctica"></div><div class="field"><label for="feeling">¿Cómo sentiste el control?</label><select id="feeling"><option value="" selected disabled>Selecciona una opción</option><option value="mejor">Mejor que antes</option><option value="similar">Similar a otras ocasiones</option><option value="dificil">Difícil de anticipar</option><option value="incomodo">Noté molestia o incomodidad</option></select></div><div class="field"><label for="notes">Observación (opcional)</label><textarea id="notes" placeholder="Algo que quieras recordar de esta sesión…"></textarea></div><p class="tiny">Nivel final de excitación: <strong>${arousal}/10</strong> · Tiempo de práctica: <strong>${timeText(elapsed)}</strong></p><button class="btn dark" type="button" id="saveBtn" ${sessionSaved?'disabled':''}>${sessionSaved?'✓ Sesión guardada':'Guardar sesión'}</button><p id="saveStatus" class="tiny" role="status"></p></section><section class="subcard"><h3>Progreso semana 1</h3><p class="tiny">${weekRows.length}/3 sesiones guardadas · ${weekRows.reduce((a,b)=>a+b.stops,0)} paradas registradas en este dispositivo</p>${weekRows.length?`<ul class="history">${weekRows.slice(-3).map(x=>`<li>${new Date(x.date).toLocaleDateString('es-CO')}: ${x.stops} parada(s), ${x.seconds} segundos, control ${x.feeling}</li>`).join('')}</ul>`:'<p class="tiny">Todavía no hay sesiones guardadas en esta vista de revisión.</p>'}<div class="notice">Estas pruebas se guardan solo en este dispositivo. No se sincronizan con las cuentas de SPM.</div></section>`}
function render(){if(step!==3&&running){elapsed=startMark+(performance.now()-startedAt)/1000;running=false;if(tick)cancelAnimationFrame(tick);tick=null}stopVoice();$('#stepText').textContent=`Paso ${step+1} de 5 · ${NAMES[step]}`;$('#percent').textContent=(step+1)*20+'%';$('#bar').style.width=(step+1)*20+'%';$('#meter').setAttribute('aria-valuenow',step+1);$('#voiceHint').hidden=step!==0;$('#listen').setAttribute('aria-label',`Escuchar explicación y recomendaciones del paso ${step+1}`);$('#prev').disabled=step===0;$('#next').textContent=step===4?'Finalizar y volver al programa':'Siguiente';$('#stage').innerHTML=step===0?rawPhoto(0):step===1?secondPage():step===2?rawPhoto(2):step===3?fourthPage():fifthPage();$('#stage').focus({preventScroll:true});if(step===1||step===3){paintGauges();$('#stage').querySelectorAll('.adjust').forEach(el=>el.addEventListener('input',e=>setArousal(e.target.value)));$('#stage').querySelectorAll('.gauge').forEach(el=>{el.addEventListener('pointerdown',e=>{if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId)}catch{}updatePointer(e,el)});el.addEventListener('pointermove',e=>{if(e.buttons)updatePointer(e,el)});el.addEventListener('keydown',e=>{let next=arousal;if(e.key==='ArrowLeft'||e.key==='ArrowDown')next--;else if(e.key==='ArrowRight'||e.key==='ArrowUp')next++;else if(e.key==='Home')next=0;else if(e.key==='End')next=10;else return;e.preventDefault();setArousal(next)})})}if(step===3){$('#timerBtn').onclick=toggleTimer;$('#resetBtn').onclick=resetTimer;$('#registerBtn').onclick=registerStop;updateTimerUI()}if(step===4)$('#saveBtn').onclick=saveRecord;document.documentElement.scrollTo?.({top:0,behavior:'instant'})}
function setArousal(v){arousal=Math.min(10,Math.max(0,Math.round(Number(v)||0)));paintGauges();document.querySelectorAll('.adjust').forEach(x=>x.value=String(arousal));document.querySelectorAll('[data-arousal]').forEach(x=>x.textContent=String(arousal));document.querySelectorAll('[data-risk]').forEach(x=>x.textContent=arousal>=8?'Zona alta: anticípate antes del punto de no retorno.':arousal<=3?'Observa con calma cómo cambian tus sensaciones.':'Reconoce el ascenso y regula con anticipación.')}
function paintGauges(){document.querySelectorAll('.gauge').forEach(svg=>{const a=(180-18*arousal)*Math.PI/180;const x=150+95*Math.cos(a),y=151-95*Math.sin(a);const line=svg.querySelector('.needle');line.setAttribute('x2',String(x));line.setAttribute('y2',String(y));svg.setAttribute('aria-valuenow',String(arousal));svg.setAttribute('aria-valuetext',arousal+' sobre diez')})}
function updatePointer(event,svg){const rect=svg.getBoundingClientRect();const px=(event.clientX-rect.left)*300/rect.width,py=(event.clientY-rect.top)*178/rect.height;const angle=Math.atan2(151-py,px-150)*180/Math.PI;setArousal(Math.round((180-Math.min(180,Math.max(0,angle)))/18))}
function timeText(sec){const s=Math.floor(sec);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateTimerUI(){const el=$('#timer');if(el)el.textContent=timeText(elapsed);const btn=$('#timerBtn');if(btn)btn.textContent=running?'⏸ Pausar':(elapsed>0?'▶ Continuar':'▶ Iniciar');const reg=$('#registerBtn');if(reg)reg.disabled=!running||stops>=6||sessionSaved}
function tickTimer(){if(!running)return;elapsed=startMark+(performance.now()-startedAt)/1000;updateTimerUI();tick=requestAnimationFrame(tickTimer)}
function toggleTimer(){running=!running;if(running){startedAt=performance.now();startMark=elapsed;tickTimer()}else{if(tick)cancelAnimationFrame(tick);tick=null}updateTimerUI()}
function resetTimer(){if(tick)cancelAnimationFrame(tick);running=false;elapsed=0;stops=0;sessionSaved=false;updateTimerUI();const cc=$('#count');if(cc)cc.textContent=String(stops);$('#stopGrid').innerHTML=Array.from({length:6},(_,i)=>`<span class="stopDot">${i+1}</span>`).join('');$('#trainingMsg').textContent='Una parada bien anticipada ya cuenta como progreso. La meta de 4–6 paradas es progresiva.'}
function registerStop(){if(!running||stops>=6)return;stops++;$('#count').textContent=String(stops);$('#stopGrid').innerHTML=Array.from({length:6},(_,i)=>`<span class="stopDot ${i<stops?'done':''}">${i<stops?'✓':i+1}</span>`).join('');$('#trainingMsg').textContent=stops>=4?'Ya alcanzaste el rango progresivo; no necesitas forzar más repeticiones.':`Has identificado ${stops} parada(s). Espera a recuperar el control antes de reanudar.`;updateTimerUI()}
function saveRecord(){const feeling=$('#feeling').value;if(!feeling){$('#saveStatus').textContent='Selecciona cómo sentiste el control antes de guardar.';$('#feeling').focus();return}if(sessionSaved)return;const rec={day:1,week:1,session:1,tech:'startstop',stops,seconds:Math.round(elapsed),arousal,feeling,notes:$('#notes').value.trim(),date:new Date().toISOString()};stored.push(rec);let persisted=false;try{localStorage.setItem(KEY,JSON.stringify(stored));persisted=true}catch(e){}sessionSaved=true;$('#saveBtn').disabled=true;$('#saveBtn').textContent='✓ Sesión guardada';$('#saveStatus').textContent=persisted?'Guardada en este dispositivo. El registro del programa real permanece sin modificar.':'Registrada en esta sesión de prueba, pero este navegador no permite conservarla al cerrar la página. No modifica la cuenta del paciente.'}
function stopVoice(){if(window.speechSynthesis)window.speechSynthesis.cancel();voiceActive=false;$('#listen').classList.remove('playing');$('#listen').setAttribute('aria-pressed','false')}
function speak(){if(voiceActive){stopVoice();return}stopVoice();if(!window.speechSynthesis){alert('Este navegador no permite reproducir voz.');return}const utter=new SpeechSynthesisUtterance(VOICES[step]);utter.lang='es-CO';utter.rate=.95;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='es-co')||speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('es'));if(v)utter.voice=v;voiceActive=true;$('#listen').classList.add('playing');$('#listen').setAttribute('aria-pressed','true');utter.onend=utter.onerror=()=>{voiceActive=false;$('#listen').classList.remove('playing');$('#listen').setAttribute('aria-pressed','false')};speechSynthesis.speak(utter)}
function finishAndReturn(){stopVoice();if(tick)cancelAnimationFrame(tick);tick=null;running=false;window.location.assign('revision-programas-28-dias.html?programa=ejaculation&dia=1')}
$('#listen').onclick=speak;$('#prev').onclick=()=>{if(step>0){step--;render()}};$('#next').onclick=()=>{if(step===4){finishAndReturn()}else{step++;render()}};window.addEventListener('pagehide',()=>{stopVoice();if(tick)cancelAnimationFrame(tick)});render();
</script></body></html>
