<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Abriendo tu revisión · SPM</title>
  <style>body{margin:0;background:#07171f;color:#f3f5f5;font:17px/1.7 system-ui,sans-serif}main{max-width:520px;margin:12vh auto;padding:28px}h1{font-size:28px;line-height:1.3}a{display:inline-block;color:#dfc18f;min-height:44px;padding:8px 0}a:focus-visible{outline:2px solid #dfc18f;outline-offset:4px}</style>
</head>
<body>
  <main>
    <h1>Tu revisión de Deseo</h1>
    <p>Abriendo el recorrido actual de los 28 días…</p>
    <p><a id="currentReview" href="/premium-v2/revision-programas-28-dias.html?programa=desire&amp;dia=1">Abrir mi revisión</a></p>
  </main>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const day=[params.get('dia'),params.get('day')].find(value=>/^(?:[1-9]|1\d|2[0-8])$/.test(value||''))||'1';
    const target='/premium-v2/revision-programas-28-dias.html?programa=desire&dia='+day;
    document.getElementById('currentReview').setAttribute('href',target);
    location.replace(target);
  })();
  </script>
</body>
</html>
