<body><header><h1>Deseo · Día 1</h1><p>Vista de revisión con perfil de ejemplo. Sin cuenta. Lo que registres aquí se borra al recargar.</p><button type="button" id="reset">Reiniciar esta prueba</button></header>
<script>
(()=>{'use strict';
 const state={'spm-desire-state':JSON.stringify({health:['none'],stimuli:['tactile']})};
 const allowed=new Set(['spm-desire-state','spm-desire-profile','spm-desire-step','spm-desire-origin','spm-desire-today','spm-desire-program','spm-desire-ctx','spm-assessment-log']);
 window.SPM_DESIRE_LAB_HOST={
 getContext:()=>({day:1,origin:'dailyPlan',restriction:'none'}),
 getState:()=>({...state}),
 write:(key,value)=>{if(!allowed.has(key)||typeof value!=='string')return false;state[key]=value;return true;}
 };
 document.getElementById('reset').onclick=()=>location.reload();
})();
</script>
<iframe title="Práctica de Deseo del día 1 — demostración" src="desire-lab/index.html?v=20261112-action1&amp;origin=dailyPlan" allow="autoplay"></iframe>
