<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Revisión · Deseo · 28 días · SPM</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="spm-resources.css"><style>[hidden]{display:none!important}.review-header{padding:18px;max-width:900px;margin:auto}#spmDailyCoach{display:none!important}.review-header h1{font-size:22px;margin:0;color:#dfc18f}.review-header p{font-size:13px;margin:6px 0}.review-header nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.review-header select{background:#15323a;color:white;font:inherit;padding:10px;border-radius:9px}#plan{display:block;max-width:900px;margin:auto;padding:16px}#reset{font:inherit;color:#bdd2d0;background:none;border:0;margin:10px 0;text-decoration:underline}.spm-daily-activity h3{font-size:24px}</style></head><body>
<header class="review-header"><h1>Revisión de Deseo · 28 días</h1><p>Perfil de ejemplo. Sin cuenta. Los registros de esta prueba duran mientras esta página está abierta.</p><nav aria-label="Día a revisar"><button class="btn sec" id="prev">← Anterior</button><label for="day">Día</label><select id="day"></select><button class="btn sec" id="next">Siguiente →</button></nav><button id="reset">Reiniciar esta prueba</button></header>
<section id="plan"></section>
<script>
(()=>{'use strict';
const c={userId:'review',planId:'review',day:1,primary:'desire',secondary:null,motives:['desire'],answers:{pf_awareness:'yes',pf_tension:1},safety:'none',flags:[],checkins:[],completed:[]};
const clone=x=>JSON.parse(JSON.stringify(x)),daily={},modules={},resource=[];
window.SPM_RESOURCE_CONTEXT=()=>clone(c);
for(const name of ['DESIRE','SENSATE','BREATHING','PELVIC']){
 modules[name]=name==='DESIRE'?{'spm-desire-state':JSON.stringify({health:['none'],stimuli:['tactile']})}:{};
 window['SPM_'+name+'_RECORDS']={read:async()=>clone(modules[name]),save:async(value,scope)=>{if(scope!=='review:review')throw Error();modules[name]=clone(value);}};
}
window.SPM_DAILY_RECORDS={read:async(scope,day)=>clone(daily[day]||{}),save:async(id,data,scope,day)=>{if(scope!=='review:review'||day!==c.day)throw Error();daily[day]??={};daily[day][id]=clone(data);}};
window.SPM_RESOURCE_RECORDS={read:async()=>clone(resource),save:async r=>resource.push(clone(r))};
window.SPM_COMPLETE_DAILY_PRACTICE=async day=>{if(day!==c.day)throw Error();if(!c.completed.includes(day))c.completed.push(day);};
window.SPM_REVIEW_SELECT_DAY=async n=>{
 for(const api of ['SPM_DESIRE_LAB','SPM_SENSATE_LAB','SPM_BREATHING_LAB','SPM_PELVIC_LAB'])if(window[api]?.close&&await window[api].close()===false)return;
 window.SPM_SLEEP_LIBRARY_V1?.close();document.querySelectorAll('dialog').forEach(x=>{x.close();x.remove();});
 c.day=Math.max(1,Math.min(28,Number(n)||1));window.SPM_CURRENT_DAY=c.day;
 const picker=document.getElementById('day');picker.value=String(c.day);document.getElementById('prev').disabled=c.day===1;document.getElementById('next').disabled=c.day===28;
 window.dispatchEvent(new Event('spm:resourcecontext'));window.SPM_DAILY_PRACTICE?.open();
};
document.getElementById('reset').onclick=()=>location.reload();
document.addEventListener('DOMContentLoaded',()=>{
 const picker=document.getElementById('day');for(let n=1;n<=28;n++){const o=document.createElement('option');o.value=n;o.textContent='Día '+n;picker.append(o);}
 picker.onchange=()=>window.SPM_REVIEW_SELECT_DAY(picker.value);document.getElementById('prev').onclick=()=>window.SPM_REVIEW_SELECT_DAY(c.day-1);document.getElementById('next').onclick=()=>window.SPM_REVIEW_SELECT_DAY(c.day+1);window.SPM_REVIEW_SELECT_DAY(1);
});
})();
</script>
