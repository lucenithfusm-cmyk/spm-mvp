<header><strong>SPM · ENTORNO DE REVISIÓN</strong><h1>Erección y firmeza · Actividad 3 · Día 6</h1>
<p>Tres pantallas médicas interactivas con audios, un cronómetro opcional y selección de un ancla sensorial. Esta vista usa datos simulados: no modifica pacientes ni pagos.</p>
<button type="button" id="reset">↻ Reiniciar recorrido</button></header>
<main id="spmDailyWorkspace"></main>
<script src="erection-fullscreen-v1.js?v=20261117-er-fullscreen-cierre1"></script><script src="erection-day3-touch-v1.js?v=20261127-technical"></script>
<script>
(()=>{'use strict';
let record=null;
function showToday(){
 const host=document.getElementById('spmDailyWorkspace');
 host.innerHTML='<section class="spm-ed3-today" role="status"><p>SPM · HOY · DÍA 6</p><h2>Lo que vas a hacer hoy</h2><p>'+(record?'Reconoce y suelta la tensión · Registrada ✓':'Tu práctica sigue pendiente.')+'</p><button type="button" id="review-again">Revisar las pantallas otra vez</button></section>';
 host.querySelector('#review-again').onclick=()=>{record=null;restart()};
 document.getElementById('reset')?.focus();
}
function restart(){window.SPM_ED_DAY3_TOUCH.mount({
 host:document.getElementById('spmDailyWorkspace'),scope:'spm-review:day6',calendarDay:6,prior:{},valid:()=>true,
 save:async r=>{
  if(!r||r.day!==6||r.erectionLesson!==3||r.erectionPracticeVersion!==1||r.confirmed!==true||r.anxiety!==null||r.confidence!==null||r.finalFeeling!==''||!Array.isArray(r.tensionAreas)||r.tensionAreas.length!==1||!['jaw','shoulders','abdomen','none'].includes(r.tensionAreas[0])||!['hands','support','sound','unknown'].includes(r.sensoryAnchor)||!(r.seconds===null||Number.isInteger(r.seconds)&&r.seconds>=0&&r.seconds<=60))throw Error('Registro simulado inválido');
  record=r;return {ok:true};
 },onBack:showToday
 });}
document.addEventListener('DOMContentLoaded',()=>{restart();document.getElementById('reset').onclick=()=>{record=null;restart()}});
window.SPM_ED3_REVIEW={getRecord:()=>record,reset:restart};
})();
</script></body></html>
